<title>무로바 — 서비스 프로토타입</title>
<style>
  :root{
    --backdrop:#DCD3B8;
    --app-bg:#F6F1E3;
    --surface:#FFFDF8;
    --ink:#1E2A44;
    --ink-soft:#5B6478;
    --ink-faint:#8B93A8;
    --accent:#A8283F;
    --accent-contrast:#FBF3EE;
    --accent-soft:#F1D9D6;
    --jade:#3D6B5C;
    --jade-soft:#DCE8E2;
    --border:rgba(30,42,68,0.12);
    --shadow:rgba(30,42,68,0.22);
    --bezel:#171B26;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --backdrop:#0A0D18;
      --app-bg:#161B2E;
      --surface:#1E2540;
      --ink:#ECE7DA;
      --ink-soft:#9BA3BC;
      --ink-faint:#6C7690;
      --accent:#E2645A;
      --accent-contrast:#1B0E0C;
      --accent-soft:#3A2230;
      --jade:#63AE93;
      --jade-soft:#1E3B33;
      --border:rgba(236,231,218,0.14);
      --shadow:rgba(0,0,0,0.55);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --backdrop:#0A0D18; --app-bg:#161B2E; --surface:#1E2540;
    --ink:#ECE7DA; --ink-soft:#9BA3BC; --ink-faint:#6C7690;
    --accent:#E2645A; --accent-contrast:#1B0E0C; --accent-soft:#3A2230;
    --jade:#63AE93; --jade-soft:#1E3B33;
    --border:rgba(236,231,218,0.14); --shadow:rgba(0,0,0,0.55);
    color-scheme: dark;
  }
  :root[data-theme="light"]{
    --backdrop:#DCD3B8; --app-bg:#F6F1E3; --surface:#FFFDF8;
    --ink:#1E2A44; --ink-soft:#5B6478; --ink-faint:#8B93A8;
    --accent:#A8283F; --accent-contrast:#FBF3EE; --accent-soft:#F1D9D6;
    --jade:#3D6B5C; --jade-soft:#DCE8E2;
    --border:rgba(30,42,68,0.12); --shadow:rgba(30,42,68,0.22);
    color-scheme: light;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    overflow-x:hidden;
    background:var(--backdrop);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Pretendard","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 16px;
  }
  .stage{
    position:relative;
    width:100%;
    max-width:1100px;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:calc(100vh - 80px);
  }
  .backdrop-deco{
    position:absolute;
    inset:0;
    pointer-events:none;
    background-image:radial-gradient(circle, rgba(30,42,68,0.14) 1px, transparent 1.4px);
    background-size:20px 20px;
    opacity:.55;
  }
  :root[data-theme="dark"] .backdrop-deco, @media (prefers-color-scheme:dark){ .backdrop-deco{opacity:.35;} }
  .postmark{
    position:absolute;
    top:6%;
    right:6%;
    width:260px;
    height:260px;
    border-radius:50%;
    border:2px dashed var(--ink);
    opacity:.08;
    pointer-events:none;
  }
  .postmark::after{
    content:"";
    position:absolute;
    inset:22px;
    border-radius:50%;
    border:1px solid var(--ink);
  }
  .brandmark{
    position:absolute;
    left:6%;
    bottom:8%;
    max-width:220px;
    pointer-events:none;
  }
  .brandmark .bm-word{
    font-size:15px;
    font-weight:800;
    letter-spacing:.02em;
    color:var(--ink);
    opacity:.16;
  }
  .brandmark .bm-sub{
    font-size:11px;
    color:var(--ink);
    opacity:.14;
    margin-top:2px;
  }

  .phone{
    position:relative;
    width:392px;
    height:822px;
    background:var(--bezel);
    border-radius:46px;
    padding:14px;
    box-shadow:0 30px 60px -20px var(--shadow), 0 2px 0 rgba(255,255,255,0.04) inset;
    z-index:1;
  }
  .phone-notch{
    position:absolute;
    top:14px; left:50%;
    transform:translateX(-50%);
    width:120px; height:24px;
    background:var(--bezel);
    border-radius:0 0 16px 16px;
    z-index:5;
  }
  .phone-screen{
    position:relative;
    width:100%; height:100%;
    background:var(--app-bg);
    border-radius:34px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .home-indicator{
    position:absolute;
    left:50%; bottom:8px;
    transform:translateX(-50%);
    width:128px; height:4px;
    border-radius:3px;
    background:var(--ink);
    opacity:.55;
    z-index:6;
  }

  .screen{
    flex:1;
    overflow-y:auto;
    overflow-x:hidden;
    display:flex;
    flex-direction:column;
    animation:screenIn .28s ease;
    -webkit-overflow-scrolling:touch;
  }
  @keyframes screenIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
  @media (prefers-reduced-motion: reduce){ .screen{animation:none;} }

  .topbar{
    position:sticky; top:0; z-index:4;
    display:flex; align-items:center; gap:10px;
    padding:16px 18px 12px;
    background:var(--app-bg);
    border-bottom:1px solid var(--border);
  }
  .iconbtn{
    width:32px; height:32px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    border:none;
    background:transparent;
    color:var(--ink);
    cursor:pointer;
    flex:none;
  }
  .iconbtn:hover{background:var(--border);}
  .iconbtn svg{width:19px;height:19px;}
  .topbar-title{
    font-size:16.5px;
    font-weight:700;
    letter-spacing:-.01em;
    flex:1;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .topbar-title .zh{
    display:block;
    font-size:10.5px;
    font-weight:500;
    color:var(--ink-faint);
    margin-top:1px;
  }
  .pill-btn{
    border:none;
    border-radius:999px;
    padding:8px 14px;
    font-size:13px;
    font-weight:700;
    background:var(--accent);
    color:var(--accent-contrast);
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:5px;
    white-space:nowrap;
    flex:none;
  }
  .pill-btn:hover{filter:brightness(1.06);}
  .pill-btn:focus-visible, .iconbtn:focus-visible, .ghost-btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .pill-btn svg{width:14px;height:14px;}

  .content{padding:16px 18px 28px;}

  .home-hero{padding:20px 18px 6px;}
  .wordmark{
    font-size:27px;
    font-weight:800;
    letter-spacing:-.02em;
    color:var(--ink);
  }
  .wordmark .dot{color:var(--accent);}
  .tagline{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .proto-note{
    font-size:11px;
    color:var(--ink-faint);
    margin-top:8px;
  }

  .search-wrap{
    margin:16px 18px 4px;
    position:relative;
  }
  .search-wrap svg{
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    width:16px;height:16px; color:var(--ink-faint);
  }
  .search-input{
    width:100%;
    padding:12px 14px 12px 38px;
    border-radius:14px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink);
    font-size:14px;
    font-family:inherit;
  }
  .search-input::placeholder{color:var(--ink-faint);}
  .search-input:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}

  .section-label{
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    letter-spacing:.03em;
    margin:22px 18px 10px;
  }

  .cat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    padding:0 18px;
  }
  .cat-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    padding:14px;
    text-align:left;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:8px;
    font-family:inherit;
    color:var(--ink);
  }
  .cat-card:hover{border-color:var(--accent);}
  .cat-card.is-soon{opacity:.62; cursor:default;}
  .cat-icon{
    width:36px; height:36px;
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    background:var(--accent-soft);
    color:var(--accent);
  }
  .cat-card.is-soon .cat-icon{background:var(--border); color:var(--ink-faint);}
  .cat-icon svg{width:19px;height:19px;}
  .cat-name{font-size:14.5px; font-weight:700;}
  .cat-sub{font-size:11px; color:var(--ink-faint); margin-top:-4px;}
  .cat-state{
    font-size:10.5px;
    font-weight:700;
    padding:3px 8px;
    border-radius:999px;
    width:fit-content;
    background:var(--jade-soft);
    color:var(--jade);
  }
  .cat-card.is-soon .cat-state{background:var(--border); color:var(--ink-faint);}

  .qlist{padding:0 18px; display:flex; flex-direction:column; gap:10px;}
  .qcard{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:14px;
    cursor:pointer;
    text-align:left;
    font-family:inherit;
    color:var(--ink);
    display:block;
    width:100%;
  }
  .qcard:hover{border-color:var(--accent);}
  .qcard-title{font-size:14.5px; font-weight:700; line-height:1.4;}
  .qcard-snippet{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:4px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .qcard-meta{
    display:flex; align-items:center; gap:10px;
    margin-top:10px;
    font-size:11.5px;
    color:var(--ink-faint);
  }
  .qcard-meta span{display:inline-flex; align-items:center; gap:4px;}
  .qcard-meta svg{width:13px;height:13px;}
  .badge-adopted{
    display:inline-flex; align-items:center; gap:3px;
    background:var(--jade-soft); color:var(--jade);
    padding:2px 8px; border-radius:999px;
    font-size:10.5px; font-weight:700;
  }
  .badge-adopted svg{width:11px;height:11px;}
  .badge-waiting{
    background:var(--border); color:var(--ink-faint);
    padding:2px 8px; border-radius:999px;
    font-size:10.5px; font-weight:700;
  }

  .empty-state{
    margin:30px 18px; padding:26px 18px;
    text-align:center;
    color:var(--ink-faint);
    font-size:12.5px;
    border:1px dashed var(--border);
    border-radius:16px;
  }

  .field-label{font-size:12.5px; font-weight:700; color:var(--ink-soft); margin:18px 0 6px;}
  select.field, input.field, textarea.field{
    width:100%;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink);
    font-family:inherit;
    font-size:14px;
    padding:11px 13px;
  }
  select.field:focus-visible, input.field:focus-visible, textarea.field:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  textarea.field{resize:vertical; min-height:100px; line-height:1.55;}
  .field::placeholder{color:var(--ink-faint);}

  .suggest-box{margin-top:8px; display:flex; flex-direction:column; gap:6px;}
  .suggest-item{
    display:flex; align-items:center; gap:8px;
    background:var(--accent-soft);
    color:var(--ink);
    border:none;
    border-radius:10px;
    padding:9px 11px;
    font-size:12.5px;
    text-align:left;
    cursor:pointer;
    font-family:inherit;
  }
  .suggest-item svg{width:13px;height:13px; color:var(--accent); flex:none;}
  .suggest-label{font-size:11px; color:var(--ink-faint); margin-top:14px;}

  .submit-row{margin-top:22px;}
  .submit-btn{
    width:100%;
    border:none; border-radius:14px;
    padding:14px;
    background:var(--accent);
    color:var(--accent-contrast);
    font-size:15px; font-weight:800;
    cursor:pointer;
  }
  .submit-btn:disabled{opacity:.4; cursor:not-allowed;}
  .submit-btn:not(:disabled):hover{filter:brightness(1.06);}

  .q-detail-head{padding:4px 18px 16px; border-bottom:1px solid var(--border);}
  .q-detail-cat{
    display:inline-block;
    font-size:10.5px; font-weight:700;
    color:var(--accent);
    background:var(--accent-soft);
    padding:3px 9px; border-radius:999px;
    margin-bottom:10px;
  }
  .q-detail-title{font-size:18.5px; font-weight:800; line-height:1.4; text-wrap:balance;}
  .author-row{display:flex; align-items:center; gap:9px; margin-top:14px;}
  .avatar{
    width:34px; height:34px; border-radius:50%;
    background:var(--ink); color:var(--app-bg);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:800; flex:none;
  }
  .author-name{font-size:13px; font-weight:700;}
  .author-tag{font-size:11px; color:var(--ink-faint); font-weight:500;}
  .author-time{font-size:11px; color:var(--ink-faint); margin-top:1px;}
  .q-detail-body{
    font-size:14px; line-height:1.75; color:var(--ink);
    margin:14px 18px 0; white-space:pre-wrap;
  }
  .q-detail-stats{
    display:flex; gap:14px; margin:14px 18px 0;
    font-size:11.5px; color:var(--ink-faint);
  }
  .q-detail-stats span{display:inline-flex; align-items:center; gap:4px;}
  .q-detail-stats svg{width:13px;height:13px;}

  .answers-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 18px 10px;
  }
  .answers-count{font-size:13.5px; font-weight:800;}
  .answer-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:14px;
    margin:0 18px 10px;
    position:relative;
  }
  .answer-card.is-hot{border-color:var(--jade);}
  .answer-top{display:flex; align-items:flex-start; gap:9px; justify-content:space-between;}
  .answer-who{display:flex; gap:9px;}
  .answer-body{
    font-size:13.5px; line-height:1.7; color:var(--ink);
    margin:10px 0 0; white-space:pre-wrap;
  }
  .answer-actions{
    display:flex; align-items:center; gap:10px; margin-top:12px;
  }
  .like-btn{
    display:inline-flex; align-items:center; gap:5px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--ink-soft);
    border-radius:999px;
    padding:6px 11px;
    font-size:12px; font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .like-btn:hover{border-color:var(--accent); color:var(--accent);}
  .like-btn svg{width:13px;height:13px;}
  .resolve-btn{
    border:1px solid var(--jade);
    background:transparent;
    color:var(--jade);
    border-radius:999px;
    padding:6px 12px;
    font-size:12px; font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .resolve-btn:hover{background:var(--jade-soft);}

  .stamp{
    flex:none;
    display:flex; align-items:center; gap:4px;
    border:1.5px dashed var(--jade);
    color:var(--jade);
    border-radius:999px;
    padding:4px 10px 4px 8px;
    font-size:10.5px; font-weight:800;
    transform:rotate(-7deg);
  }
  .stamp svg{width:11px;height:11px;}

  .composer{
    position:sticky; bottom:0;
    background:var(--app-bg);
    border-top:1px solid var(--border);
    padding:12px 18px 16px;
    margin-top:auto;
  }
  .composer textarea{margin-bottom:8px;}

  .toast{
    position:absolute;
    left:50%; bottom:80px;
    transform:translateX(-50%);
    background:var(--ink);
    color:var(--app-bg);
    font-size:12.5px; font-weight:600;
    padding:10px 16px;
    border-radius:999px;
    box-shadow:0 10px 24px var(--shadow);
    z-index:20;
    animation:toastIn .2s ease;
    white-space:nowrap;
  }
  @keyframes toastIn{ from{opacity:0; transform:translate(-50%,8px);} to{opacity:1; transform:translate(-50%,0);} }

  .profile-card{
    margin:6px 18px 4px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
    text-align:center;
  }
  .profile-avatar{
    width:56px;height:56px;border-radius:50%;
    background:var(--ink); color:var(--app-bg);
    display:flex; align-items:center; justify-content:center;
    font-size:20px; font-weight:800;
    margin:0 auto 10px;
  }
  .profile-name{font-size:16px; font-weight:800;}
  .profile-tag{font-size:12px; color:var(--ink-faint); margin-top:2px;}
  .stat-row{
    display:flex; margin-top:16px;
    border-top:1px solid var(--border);
    padding-top:14px;
  }
  .stat{flex:1;}
  .stat b{display:block; font-size:16px; font-variant-numeric:tabular-nums;}
  .stat span{font-size:11px; color:var(--ink-faint);}

  .tabs{display:flex; gap:6px; margin:20px 18px 12px; border-bottom:1px solid var(--border);}
  .tab-btn{
    border:none; background:transparent;
    font-family:inherit; font-size:13px; font-weight:700;
    color:var(--ink-faint);
    padding:9px 4px; margin-right:14px;
    cursor:pointer;
    border-bottom:2px solid transparent;
  }
  .tab-btn.is-active{color:var(--ink); border-color:var(--accent);}

  .notif-item{
    display:flex; gap:10px; align-items:flex-start;
    padding:12px 18px;
    border-bottom:1px solid var(--border);
    font-size:13px;
  }
  .notif-item svg{width:16px;height:16px; color:var(--accent); flex:none; margin-top:1px;}
  .notif-time{font-size:11px; color:var(--ink-faint); margin-top:2px;}

  .mylist-item{
    padding:13px 18px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
    background:transparent;
    border-left:none;border-right:none;border-top:none;
    width:100%; text-align:left; font-family:inherit; color:var(--ink);
  }
  .mylist-item:hover{background:var(--surface);}
  .mylist-q{font-size:11px; color:var(--ink-faint); margin-bottom:3px;}
  .mylist-a{font-size:13px; line-height:1.55; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}

  .bottomnav{
    display:flex;
    border-top:1px solid var(--border);
    background:var(--app-bg);
    padding:8px 6px 14px;
    flex:none;
    position:relative;
    z-index:3;
  }
  .bn-item{
    flex:1;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    background:transparent; border:none;
    color:var(--ink-faint);
    font-family:inherit; font-size:10px; font-weight:700;
    padding:4px 2px;
    cursor:pointer;
  }
  .bn-item svg{width:20px;height:20px;}
  .bn-item.is-active{color:var(--accent);}
  .bn-item:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .bn-item.is-center{position:relative; top:-14px;}
  .bn-item.is-center .bn-center-circle{
    width:46px; height:46px; border-radius:50%;
    background:var(--accent); color:var(--accent-contrast);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 16px -4px var(--shadow);
    margin-bottom:2px;
  }
  .bn-item.is-center .bn-center-circle svg{width:22px;height:22px;}

  .role-grid{display:flex; flex-direction:column; gap:10px; margin-top:6px;}
  .role-card{
    background:var(--surface); border:1px solid var(--border); border-radius:18px;
    padding:16px; text-align:left; cursor:pointer; font-family:inherit; color:var(--ink);
    display:flex; flex-direction:column; gap:6px;
  }
  .role-card:hover{border-color:var(--accent);}

  .verify-banner{
    margin:16px 18px 4px;
    background:var(--accent-soft);
    border:1px solid var(--accent);
    border-radius:16px;
    padding:14px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .verify-banner b{font-size:13px;}
  .verify-banner-sub{font-size:11px; color:var(--ink-soft); margin-top:2px;}

  .owner-badge{
    display:inline-flex; align-items:center; gap:3px;
    font-size:10.5px; font-weight:700;
    color:var(--accent);
    background:var(--accent-soft);
    padding:2px 7px; border-radius:999px;
  }
  .owner-badge svg{width:10px;height:10px;}

  .filter-chips{display:flex; flex-wrap:wrap; gap:8px; padding:0 18px; margin-top:14px;}
  .filter-select-row{padding:10px 18px 0;}
  .chip-toggle-row{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    border:1px solid var(--border); background:var(--surface); color:var(--ink);

  return REVIEWS.filter(r=>r.authorId===id).reduce((sum,r)=>sum+(r.months||0), 0);

function formatCareer(totalMonths){
  if(totalMonths < 12) return `${totalMonths}개월`;
  const years = Math.floor(totalMonths/12);
  const months = totalMonths % 12;
  return `${years}년 ${months}개월`;
}

  if(view==='mypage') state.tab = state.role==='owner' ? 'listings' : 'reviews';
  if(view==='category') state.catTab = 'questions';
  document.getElementById('screen').scrollTop = 0;
  render();
}

function showToast(msg){
  const host = document.getElementById('toastHost');
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  host.innerHTML = '';
  host.appendChild(t);
  setTimeout(()=>{ if(host.contains(t)) host.removeChild(t); }, 2200);
}

function render(){
  const el = document.getElementById('screen');
  if(state.view==='onboarding') el.innerHTML = renderOnboarding();
  else if(state.view==='feed') el.innerHTML = renderFeed();
  else if(state.view==='qa') el.innerHTML = renderQA();
  else if(state.view==='reviewForm') el.innerHTML = renderReviewForm();
  else if(state.view==='reviewDetail') el.innerHTML = renderReviewDetail(state.param);
  else if(state.view==='userProfile') el.innerHTML = renderUserProfile(state.param);
  else if(state.view==='home') el.innerHTML = renderHome();
  else if(state.view==='category') el.innerHTML = renderCategory(state.param);
  else if(state.view==='ask') el.innerHTML = renderAsk(state.param);
  else if(state.view==='detail') el.innerHTML = renderDetail(state.param);
  else if(state.view==='listingForm') el.innerHTML = renderListingForm();
  else if(state.view==='listingDetail') el.innerHTML = renderListingDetail(state.param);
  else if(state.view==='notifs') el.innerHTML = renderNotifs();
  else if(state.view==='mypage') el.innerHTML = renderMyPage();
  document.getElementById('bottomNavHost').innerHTML = state.view==='onboarding' ? '' : renderBottomNav();
  if(state.view==='ask') toggleAskSubmit();
  if(state.view==='listingForm') toggleListingSubmit();
  if(state.view==='reviewForm') toggleReviewSubmit();
}

function currentTabKey(){
  if(state.role==='owner'){
    if(state.view==='home') return 'home';
    if(state.view==='category') return 'alba';
    if(state.view==='listingForm') return 'listingForm';
    if(state.view==='notifs') return 'notifs';
    if(state.view==='mypage') return 'mypage';
    return null;
  }
  if(state.view==='feed') return 'feed';
  if(state.view==='qa' || state.view==='ask') return 'qa';
  if(state.view==='reviewForm') return 'reviewForm';
  if(state.view==='notifs') return 'notifs';
  if(state.view==='mypage') return 'mypage';
  return null;
}

function renderBottomNav(){
  const tabs = state.role==='owner' ? OWNER_TABS : STUDENT_TABS;
  const activeKey = currentTabKey();
  return `<nav class="bottomnav">
    ${tabs.map(t=>{
      if(t.isCenter){
        return `<button class="bn-item is-center" onclick="${t.onclick}" aria-label="${t.label}"><span class="bn-center-circle">${icon(t.icon)}</span></button>`;
      }
      return `<button class="bn-item ${t.key===activeKey?'is-active':''}" onclick="${t.onclick}">${icon(t.icon)}<span>${t.label}</span></button>`;
    }).join('')}
  </nav>`;
}

function toggleDayChip(el){
  el.classList.toggle('is-active');
}

function selectKoreanChip(el){
  const row = document.getElementById('rKorean');
  row.querySelectorAll('.chip').forEach(c=>c.classList.remove('is-active'));
  el.classList.add('is-active');
  toggleReviewSubmit();
}

function toggleReviewSubmit(){
  const good = document.getElementById('rGood');
  const hard = document.getElementById('rHard');
  const tip = document.getElementById('rTip');
  const months = document.getElementById('rMonths');
  const btn = document.getElementById('rSubmitBtn');
  if(!good || !btn) return;
  const koreanSelected = document.querySelector('#rKorean .chip.is-active');
  const monthsValid = months.value && Number(months.value) >= 1;
  btn.disabled = !(good.value.trim() && hard.value.trim() && tip.value.trim() && koreanSelected && monthsValid);
}

function submitReview(){
  const industry = document.getElementById('rIndustry').value;
  const shopName = document.getElementById('rShop').value.trim();
  const months = Number(document.getElementById('rMonths').value);
  const days = Array.from(document.querySelectorAll('#rDays .chip.is-active')).map(c=>c.dataset.day);
  const timeOfDay = document.getElementById('rTimeOfDay').value;
  const koreanEl = document.querySelector('#rKorean .chip.is-active');
  const korean = koreanEl ? koreanEl.dataset.korean : '';
  const good = document.getElementById('rGood').value.trim();
  const hard = document.getElementById('rHard').value.trim();
  const note = document.getElementById('rNote').value.trim();
  const tip = document.getElementById('rTip').value.trim();
  if(!good || !hard || !tip || !korean || !(months >= 1)) return;
  const id = 'r' + (REVIEWS.length + 1) + '_' + Math.random().toString(36).slice(2,6);
  REVIEWS.unshift({id, industry, shopName, months, days, timeOfDay, korean, good, hard, note, tip, authorId:ME_STUDENT.id, time:'방금 전', views:1, likes:0});
  navigate('reviewDetail', id);
  showToast('후기가 등록됐어요');
}

function qcardHTML(item, showCat){
  const c = catOf(item.cat);
  const maxLikes = Math.max(0, ...item.answers.map(a=>a.likes));
  let statusBadge;
  if(item.resolved) statusBadge = `<span class="badge-adopted">${icon('check')} 답변완료</span>`;
  else if(item.answers.length === 0) statusBadge = `<span class="badge-waiting">답변 대기중</span>`;
  else if(maxLikes === 0) statusBadge = `<span class="badge-waiting">답변 있음</span>`;
  else statusBadge = `<span class="badge-adopted">${icon('heart')} 인기 답변</span>`;
  return `
    <button class="qcard" onclick="navigate('detail','${item.id}')">
      <div class="qcard-title">${esc(item.title)}</div>
      <div class="qcard-snippet">${esc(item.body)}</div>
      <div class="qcard-meta">
        ${showCat ? `<span>${icon(c.icon)} ${c.name}</span>` : ''}
        <span>${icon('msg')} 답변 ${item.answers.length}</span>
        <span>${icon('eye')} ${item.views}</span>
        ${statusBadge}
      </div>
    </button>
  `;
}

      ${tab==='questions'
        ? `<div class="qlist" style="padding:0 18px;">${list.length ? list.map(item=>qcardHTML(item,false)).join('') : `<div class="empty-state">아직 질문이 없어요. 첫 질문을 남겨보세요.</div>`}</div>`
        : `<div class="qlist" style="padding:0 18px;">${LISTINGS.length ? LISTINGS.map(listingCardHTML).join('') : `<div class="empty-state">아직 등록된 공고가 없어요.</div>`}</div>`}
    </div>
  `;
}

function setCatTab(tab){
  state.catTab = tab;
  render();
}

function listingCardHTML(l){
  return `
    <button class="qcard" onclick="navigate('listingDetail','${l.id}')">
      <div class="qcard-title">${esc(l.title)}</div>
      <div class="qcard-meta" style="margin-top:6px;">
        <span>${icon('pin')} ${esc(l.area)}</span>
        <span>₩${esc(l.wage)} · ${esc(l.korean)}</span>
      </div>
      <div class="qcard-meta">
        <span>${icon('eye')} ${l.views}</span>
        ${l.owner.verified ? `<span class="badge-adopted">${icon('check')} 인증사장님</span>` : `<span class="badge-waiting">인증대기</span>`}
      </div>
    </button>
  `;
}

function renderAsk(catId){
  const active = CATEGORIES.filter(c=>c.active);
  const options = active.map(c=>`<option value="${c.id}" ${c.id===catId?'selected':''}>${c.name} · ${c.zh}</option>`).join('');
  const backTarget = state.role==='owner' ? `navigate('category','${catId}')` : `navigate('qa')`;
  const prefill = state.askPrefill || '';
  state.askPrefill = null;
  return `
    <div class="topbar">
      <button class="iconbtn" onclick="${backTarget}" aria-label="뒤로">${icon('back')}</button>
      <div class="topbar-title">질문 작성<span class="zh">提问</span></div>
    </div>
    <div class="content">
      <div class="field-label">카테고리</div>
      <select id="askCat" class="field">${options}</select>

      <div class="field-label">제목</div>
      <input id="askTitle" class="field" type="text" value="${esc(prefill)}" placeholder="예) 이 알바 시급 정상인가요?" oninput="onAskTitleInput(this.value)">
      <div id="suggestArea"></div>

      <div class="field-label">내용</div>
      <textarea id="askBody" class="field" placeholder="상황을 자세히 설명하면 더 정확한 답변을 받을 수 있어요" oninput="toggleAskSubmit()"></textarea>

      <div class="submit-row">
        <button id="askSubmitBtn" class="submit-btn" disabled onclick="submitQuestion()">질문 등록하기</button>
      </div>
    </div>
  `;
}

function onAskTitleInput(v){
  const area = document.getElementById('suggestArea');
  const q = v.trim().toLowerCase();
  if(q.length < 2){ area.innerHTML=''; return; }
  const catSel = document.getElementById('askCat').value;
  const matches = QUESTIONS.filter(item => item.cat===catSel && item.title.toLowerCase().includes(q)).slice(0,2);
  if(!matches.length){ area.innerHTML=''; return; }
  area.innerHTML = `
    <div class="suggest-label">이미 비슷한 질문이 있어요</div>
    <div class="suggest-box">
      ${matches.map(item=>`<button class="suggest-item" onclick="navigate('detail','${item.id}')">${icon('link')} ${esc(item.title)}</button>`).join('')}
    </div>
  `;
}

function toggleAskSubmit(){
  const t = document.getElementById('askTitle');
  const b = document.getElementById('askBody');
  const btn = document.getElementById('askSubmitBtn');
  if(!t || !b || !btn) return;
  btn.disabled = !(t.value.trim() && b.value.trim());
}

function currentPersonAuthor(){
  if(state.role==='owner') return {name:ME_OWNER.name, role:'owner', shop:ME_OWNER.shop, verified:ME_OWNER.verified};
  const s = studentOf(ME_STUDENT.id);
  return {name:s.name, dept:s.dept, year:s.year, stay:s.stay};
}

function submitQuestion(){
  const cat = document.getElementById('askCat').value;
  const title = document.getElementById('askTitle').value.trim();
  const body = document.getElementById('askBody').value.trim();
  if(!title || !body) return;
  const id = 'q' + (QUESTIONS.length + 1) + '_' + Math.random().toString(36).slice(2,6);
  const newQ = {id, cat, title, body, author:currentPersonAuthor(), time:'방금 전', views:1, answers:[], resolved:false, resolvedIdx:null};
  QUESTIONS.unshift(newQ);
  navigate('detail', id);
  showToast('질문이 등록됐어요');
}

function isHot(a, allAnswers){
  return allAnswers.length > 1 && a.likes > 0 && a.likes === Math.max(...allAnswers.map(x=>x.likes));
}

function renderDetail(id){
  const item = qOf(id);
  const c = catOf(item.cat);
  const backTarget = state.role==='owner' ? `navigate('category','${item.cat}')` : `navigate('qa')`;
  const sortedAnswers = item.answers.map((a, originalIdx)=>({a, originalIdx})).sort((x,y)=>y.a.likes - x.a.likes);
  const isAsker = state.role!=='owner' && item.author.name===studentOf(ME_STUDENT.id).name;
  return `
    <div class="topbar">
      <button class="iconbtn" onclick="${backTarget}" aria-label="뒤로">${icon('back')}</button>
      <div class="topbar-title">${c.name}<span class="zh">${c.zh}</span></div>
    </div>
    <div class="q-detail-head">
      <div class="q-detail-cat">${c.name}</div>
      <div class="q-detail-title">${esc(item.title)}</div>
      <div class="author-row">
        <div class="avatar">${initial(item.author.name)}</div>
        <div>
          <div class="author-name">${esc(item.author.name)}${roleTag(item.author)}</div>
          <div class="author-time">${item.time}${personSub(item.author) ? ' · '+personSub(item.author) : ''}</div>
        </div>
      </div>
    </div>
    <div class="q-detail-body">${esc(item.body)}</div>
    <div class="q-detail-stats">
      <span>${icon('eye')} 조회 ${item.views}</span>
      <span>${icon('msg')} 답변 ${item.answers.length}</span>
    </div>
    <div class="answers-head">
      <div class="answers-count">답변 ${item.answers.length}개</div>
      ${item.resolved ? `<span class="badge-adopted">${icon('check')} 답변완료</span>` : ''}
    </div>
    ${item.answers.length ? sortedAnswers.map(({a, originalIdx})=>answerHTML(item.id, a, originalIdx, item.answers, item, isAsker)).join('') : `<div class="empty-state">아직 답변이 없어요. 첫 답변을 남겨보세요.</div>`}
    <div class="composer">
      <textarea id="answerBody" class="field" placeholder="아는 만큼 답해주세요. 큰 도움이 돼요."></textarea>
      <button class="submit-btn" onclick="submitAnswer('${item.id}')">답변 남기기</button>
    </div>
  `;
}

function answerHTML(qid, a, idx, allAnswers, item, isAsker){
  const isResolver = item.resolved && item.resolvedIdx===idx;
  const hot = !item.resolved && isHot(a, allAnswers);
  let stamp = '';
  if(isResolver) stamp = `<div class="stamp">${icon('check')} 답변완료</div>`;
  else if(hot) stamp = `<div class="stamp">${icon('heart')} 인기 답변</div>`;
  return `
    <div class="answer-card ${isResolver||hot ? 'is-hot' : ''}">
      <div class="answer-top">
        <div class="answer-who">
          <div class="avatar">${initial(a.author.name)}</div>
          <div>
            <div class="author-name">${esc(a.author.name)}${roleTag(a.author)}</div>
            <div class="author-time">${a.time}${personSub(a.author) ? ' · '+personSub(a.author) : ''}</div>
          </div>
        </div>
        ${stamp}
      </div>
      <div class="answer-body">${esc(a.body)}</div>
      <div class="answer-actions">
        <button class="like-btn" onclick="toggleLike('${qid}',${idx})">${icon('heart')} ${a.likes}</button>
        ${isAsker && !item.resolved ? `<button class="resolve-btn" onclick="resolveQuestion('${qid}',${idx})">이 답변으로 완료하기</button>` : ''}
      </div>
    </div>
  `;
}

function toggleLike(qid, idx){
  const item = qOf(qid);
  item.answers[idx].likes += 1;
  render();
}

function resolveQuestion(qid, idx){
  const item = qOf(qid);
  item.resolved = true;
  item.resolvedIdx = idx;
  render();
  showToast('답변완료로 표시했어요');
}

function submitAnswer(qid){
  const ta = document.getElementById('answerBody');
  const body = ta.value.trim();
  if(!body) return;
  const item = qOf(qid);
  item.answers.push({author:currentPersonAuthor(), body, likes:0, time:'방금 전'});
  render();
  showToast('답변이 등록됐어요');
}

function renderListingForm(){
  return `
    <div class="topbar">
      <button class="iconbtn" onclick="navigate('category','alba')" aria-label="뒤로">${icon('back')}</button>
      <div class="topbar-title">공고 등록<span class="zh">发布招聘</span></div>
    </div>
    <div class="content">
      <div class="field-label">제목</div>
      <input id="lTitle" class="field" type="text" placeholder="예) 주말 홀서빙 알바 구해요" oninput="toggleListingSubmit()">

      <div class="field-label">지역</div>
      <input id="lArea" class="field" type="text" placeholder="예) 신촌" oninput="toggleListingSubmit()">

      <div class="field-label">시급 (원)</div>
      <input id="lWage" class="field" type="text" placeholder="예) 10,500" oninput="toggleListingSubmit()">

      <div class="field-label">필요 한국어 수준</div>
      <select id="lKorean" class="field">
        <option>초급 가능</option>
        <option>일상 대화 가능</option>
        <option>능숙 필요</option>
      </select>

      <div class="field-label">연락 방법</div>
      <input id="lContact" class="field" type="text" placeholder="예) 카카오톡 ID: xxxx" oninput="toggleListingSubmit()">

      <div class="proto-note" style="margin-top:10px;">* 등록하면 상세페이지에 "체류자격외활동허가 확인" 안내 문구가 자동으로 표시돼요.</div>

      <div class="submit-row">
        <button id="lSubmitBtn" class="submit-btn" disabled onclick="submitListing()">공고 등록하기</button>
      </div>
    </div>
  `;
}

function toggleListingSubmit(){
  const t=document.getElementById('lTitle'), a=document.getElementById('lArea'), w=document.getElementById('lWage'), c=document.getElementById('lContact');
  const btn=document.getElementById('lSubmitBtn');
  if(!t || !btn) return;
  btn.disabled = !(t.value.trim() && a.value.trim() && w.value.trim() && c.value.trim());
}

function submitListing(){
  const title = document.getElementById('lTitle').value.trim();
  const area = document.getElementById('lArea').value.trim();
  const wage = document.getElementById('lWage').value.trim();
  const korean = document.getElementById('lKorean').value;
  const contact = document.getElementById('lContact').value.trim();
  if(!title || !area || !wage || !contact) return;
  const id = 'l' + (LISTINGS.length + 1) + '_' + Math.random().toString(36).slice(2,6);
  LISTINGS.unshift({id, title, area, wage, korean, contact, owner:{name:ME_OWNER.name, shop:ME_OWNER.shop, verified:ME_OWNER.verified}, time:'방금 전', views:1});
  navigate('listingDetail', id);
  showToast('공고가 등록됐어요');
}

function renderListingDetail(id){
  const l = lOf(id);
  return `
    <div class="topbar">
      <button class="iconbtn" onclick="navigate('category','alba')" aria-label="뒤로">${icon('back')}</button>
      <div class="topbar-title">공고 상세<span class="zh">招聘详情</span></div>
    </div>
    <div class="q-detail-head">
      <div class="q-detail-cat">아르바이트 공고</div>
      <div class="q-detail-title">${esc(l.title)}</div>
      <div class="author-row">
        <div class="avatar">${initial(l.owner.shop)}</div>
        <div>
          <div class="author-name">${esc(l.owner.shop)} <span class="owner-badge">${icon(l.owner.verified?'check':'shop')} ${l.owner.verified?'인증':'인증대기'}</span></div>
          <div class="author-time">${esc(l.owner.name)} 사장님 · ${l.time}</div>
        </div>
      </div>
    </div>
    <div class="content" style="padding-top:14px;">
      <div class="qcard-meta" style="font-size:13px; gap:16px;">
        <span>${icon('pin')} ${esc(l.area)}</span>
        <span>₩${esc(l.wage)} / 시급</span>
      </div>
      <div class="qcard-meta" style="font-size:13px; margin-top:8px;">
        <span>필요 한국어: ${esc(l.korean)}</span>
      </div>
      <div class="field-label">연락 방법</div>
      <div class="empty-state" style="text-align:left; margin:0;">${esc(l.contact)}</div>
      <div class="proto-note" style="margin-top:14px;">지원 전, 체류자격외활동허가를 확인하셨는지 꼭 확인해주세요.</div>
    </div>
  `;
}

function renderNotifs(){
  return `
    <div class="topbar">
      <div class="topbar-title">알림<span class="zh">通知</span></div>
    </div>
    <div>
      ${NOTIFS.map(n=>`
        <div class="notif-item">
          ${icon('bell')}
          <div>
            <div>${esc(n.text)}</div>
            <div class="notif-time">${esc(n.sub)} · ${n.time}</div>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderMyPage(){
  return state.role==='owner' ? renderMyPageOwner() : renderMyPageStudent();
}

function renderMyPageStudent(){
  const s = studentOf(ME_STUDENT.id);
  return `
    <div class="topbar">
      <div class="topbar-title">마이페이지<span class="zh">我的</span></div>
    </div>
    <div class="profile-card">
      <div class="profile-avatar">${initial(s.name)}</div>
      <div class="profile-name">${esc(s.name)}</div>
      <div class="profile-tag">${esc(s.dept)} · ${esc(s.year)} · 체류 ${esc(s.stay)}</div>
      <div class="stat-row">
        <div class="stat"><b>${ME_STUDENT.answers}</b><span>답변</span></div>
        <div class="stat"><b>${bestAnswerCountOf(s.name)}</b><span>베스트 답변</span></div>
        <div class="stat"><b>${ME_STUDENT.likes}</b><span>받은 좋아요</span></div>
        <div class="stat"><b>${formatCareer(careerMonthsOf(ME_STUDENT.id))}</b><span>경력</span></div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn ${state.tab==='reviews'?'is-active':''}" onclick="setMyTab('reviews')">내 후기</button>
      <button class="tab-btn ${state.tab==='openQuestions'?'is-active':''}" onclick="setMyTab('openQuestions')">진행중 Q&A</button>
    </div>
    <div id="myTabBody">${renderMyTabBody()}</div>
    <div class="content" style="padding-top:8px;">
      <button class="pill-btn" style="width:100%; justify-content:center;" onclick="navigate('onboarding')">다른 모드로 보기 (프로토타입 전용)</button>
    </div>
  `;
}

function renderMyPageOwner(){
  const myListingCount = LISTINGS.filter(l=>l.owner.name===ME_OWNER.name).length;
  return `
    <div class="topbar">
      <div class="topbar-title">마이페이지<span class="zh">我的</span></div>
    </div>
    <div class="profile-card">
      <div class="profile-avatar">${initial(ME_OWNER.shop)}</div>
      <div class="profile-name">${ME_OWNER.shop}</div>
      <div class="profile-tag">${ME_OWNER.name} 사장님 · ${ME_OWNER.category}</div>
      <div style="margin-top:10px;">
        ${ME_OWNER.verified
          ? `<span class="badge-adopted">${icon('check')} 인증완료</span>`
          : `<button class="pill-btn" onclick="verifyOwner()">${icon('shop')} 인증 신청하기</button>`}
      </div>
      <div class="stat-row">
        <div class="stat"><b>${ME_OWNER.answers}</b><span>답변</span></div>
        <div class="stat"><b>${ME_OWNER.adoptRate}%</b><span>채택률</span></div>
        <div class="stat"><b>${myListingCount}</b><span>등록 공고</span></div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn ${state.tab==='listings'?'is-active':''}" onclick="setMyTab('listings')">내 공고</button>
      <button class="tab-btn ${state.tab==='answers'?'is-active':''}" onclick="setMyTab('answers')">내 답변</button>
    </div>
    <div id="myTabBody">${renderMyTabBody()}</div>
    <div class="content" style="padding-top:8px;">
      <button class="pill-btn" style="width:100%; justify-content:center;" onclick="navigate('onboarding')">다른 모드로 보기 (프로토타입 전용)</button>
    </div>
  `;
}

function setMyTab(tab){
  state.tab = tab;
  render();
}

function renderMyTabBody(){
  if(state.tab==='listings'){
    const mine = LISTINGS.filter(l=>l.owner.name===ME_OWNER.name);
    if(!mine.length) return `<div class="empty-state">아직 등록한 공고가 없어요.</div>`;
    return `<div class="qlist" style="padding:0 18px;">${mine.map(listingCardHTML).join('')}</div>`;
  }
  if(state.tab==='reviews'){
    const mine = REVIEWS.filter(r=>r.authorId===ME_STUDENT.id);
    if(!mine.length) return `<div class="empty-state">아직 작성한 후기가 없어요.</div>`;
    return `<div class="qlist" style="padding:0 18px;">${mine.map(reviewCardHTML).join('')}</div>`;
  }
  if(state.tab==='openQuestions'){
    const name = studentOf(ME_STUDENT.id).name;
    const mine = QUESTIONS.filter(q=>q.author.name===name && !q.resolved);
    if(!mine.length) return `<div class="empty-state">진행중인 질문이 없어요.</div>`;
    return `<div class="qlist" style="padding:0 18px;">${mine.map(item=>qcardHTML(item,false)).join('')}</div>`;
  }
  return myAnswersList(ME_OWNER.name);
}

function myAnswersList(name){
  const mine = [];
  QUESTIONS.forEach(item=>{
    item.answers.forEach(a=>{
      if(a.author.name===name) mine.push({q:item, a});
    });
  });
  if(!mine.length) return `<div class="empty-state">아직 남긴 답변이 없어요.</div>`;
  return mine.map(m=>`
    <button class="mylist-item" onclick="navigate('detail','${m.q.id}')">
      <div class="mylist-q">${esc(m.q.title)}</div>
      <div class="mylist-a">${esc(m.a.body)}</div>
    </button>
  `).join('');
}

render();
</script>
