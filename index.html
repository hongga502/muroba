<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>무로바 问吧 — 유학생 알바 후기·Q&amp;A</title>
<meta name="description" content="중앙대 유학생 선배들이 직접 쓴 아르바이트 후기와 답변. 먼저 겪어본 선배에게 물어보세요.">
<meta property="og:type" content="website">
<meta property="og:title" content="무로바 问吧 — 유학생 알바 후기·Q&amp;A">
<meta property="og:description" content="중앙대 유학생 선배들이 직접 쓴 아르바이트 후기와 답변. 问问已经经历过的学长学姐">
<meta name="theme-color" content="#F8F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1614" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23C8321E'/%3E%3Ctext x='32' y='45' font-size='36' font-weight='700' text-anchor='middle' fill='white' font-family='sans-serif'%3E바%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Jua&family=ZCOOL+KuaiLe&display=swap">
<style>
  /* 색상: 적색 계열(형광펜 노트). --hl은 형광펜·말풍선 색, --accent는 버튼·배지·체크 색 */
  :root{
    --backdrop:#E9DFD9; --app-bg:#F8F4F1; --surface:#FFFFFF;
    --ink:#241A17; --ink-soft:#6B5B55; --ink-faint:#7A6A64;
    --accent:#C8321E; --accent-contrast:#FFFFFF; --accent-soft:#FFE8E1;
    --hl:#FFC2B2; --chip-bg:#F1E9E5; --line-strong:#D6CAC4;
    --jade:#C8321E; --jade-soft:#FFE8E1;
    --border:rgba(36,26,23,0.13); --shadow:rgba(36,26,23,0.22);
    --bezel:#1C1614;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
    --backdrop:#120D0B; --app-bg:#1E1614; --surface:#2A201D;
    --ink:#F5ECE7; --ink-soft:#BBAAA3; --ink-faint:#A39289;
    --accent:#FF7B63; --accent-contrast:#2A0E08; --accent-soft:#45261F;
    --hl:#7A3A2C; --chip-bg:#352925; --line-strong:rgba(245,236,231,0.24);
    --jade:#FF7B63; --jade-soft:#45261F;
    --border:rgba(245,236,231,0.14); --shadow:rgba(0,0,0,0.55);
    --bezel:#0C0908;
    color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --backdrop:#120D0B; --app-bg:#1E1614; --surface:#2A201D;
    --ink:#F5ECE7; --ink-soft:#BBAAA3; --ink-faint:#A39289;
    --accent:#FF7B63; --accent-contrast:#2A0E08; --accent-soft:#45261F;
    --hl:#7A3A2C; --chip-bg:#352925; --line-strong:rgba(245,236,231,0.24);
    --jade:#FF7B63; --jade-soft:#45261F;
    --border:rgba(245,236,231,0.14); --shadow:rgba(0,0,0,0.55);
    --bezel:#0C0908;
    color-scheme: dark;
  }
  :root[data-theme="light"]{
    --backdrop:#E9DFD9; --app-bg:#F8F4F1; --surface:#FFFFFF;
    --ink:#241A17; --ink-soft:#6B5B55; --ink-faint:#7A6A64;
    --accent:#C8321E; --accent-contrast:#FFFFFF; --accent-soft:#FFE8E1;
    --hl:#FFC2B2; --chip-bg:#F1E9E5; --line-strong:#D6CAC4;
    --jade:#C8321E; --jade-soft:#FFE8E1;
    --border:rgba(36,26,23,0.13); --shadow:rgba(36,26,23,0.22);
    --bezel:#1C1614;
    color-scheme: light;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    overflow-x:hidden;
    background:var(--backdrop);
    font-family:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Pretendard","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 16px;
  }
  .stage{
    position:relative;
    width:100%;
    max-width:1100px;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:calc(100vh - 80px);
  }
  .backdrop-deco{
    position:absolute;
    inset:0;
    pointer-events:none;
    background-image:radial-gradient(circle, rgba(36,26,23,0.14) 1px, transparent 1.4px);
    background-size:20px 20px;
    opacity:.55;
  }
  :root[data-theme="dark"] .backdrop-deco, @media (prefers-color-scheme:dark){ .backdrop-deco{opacity:.35;} }
  .postmark{
    position:absolute;
    top:6%;
    right:6%;
    width:260px;
    height:260px;
    border-radius:50%;
    border:2px dashed var(--ink);
    opacity:.08;
    pointer-events:none;
  }
  .postmark::after{
    content:"";
    position:absolute;
    inset:22px;
    border-radius:50%;
    border:1px solid var(--ink);
  }
  .brandmark{
    position:absolute;
    left:6%;
    bottom:8%;
    max-width:220px;
    pointer-events:none;
  }
  .brandmark .bm-word{
    font-size:15px;
    font-weight:800;
    letter-spacing:.02em;
    color:var(--ink);
    opacity:.16;
  }
  .brandmark .bm-sub{
    font-size:11px;
    color:var(--ink);
    opacity:.14;
    margin-top:2px;
  }

  .phone{
    position:relative;
    width:392px;
    height:822px;
    background:var(--bezel);
    border-radius:46px;
    padding:14px;
    box-shadow:0 30px 60px -20px var(--shadow), 0 2px 0 rgba(255,255,255,0.04) inset;
    z-index:1;
  }
  .phone-notch{
    position:absolute;
    top:14px; left:50%;
    transform:translateX(-50%);
    width:120px; height:24px;
    background:var(--bezel);
    border-radius:0 0 16px 16px;
    z-index:5;
  }
  .phone-screen{
    position:relative;
    width:100%; height:100%;
    background:var(--app-bg);
    border-radius:34px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .home-indicator{
    position:absolute;
    left:50%; bottom:8px;
    transform:translateX(-50%);
    width:128px; height:4px;
    border-radius:3px;
    background:var(--ink);
    opacity:.55;
    z-index:6;
  }

  .screen{
    flex:1;
    overflow-y:auto;
    overflow-x:hidden;
    display:flex;
    flex-direction:column;
    animation:screenIn .28s ease;
    -webkit-overflow-scrolling:touch;
  }
  @keyframes screenIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
  @media (prefers-reduced-motion: reduce){ .screen{animation:none;} }

  .topbar{
    position:sticky; top:0; z-index:4;
    display:flex; align-items:center; gap:10px;
    padding:16px 18px 12px;
    background:var(--app-bg);
    border-bottom:1px solid var(--border);
  }
  .iconbtn{
    width:32px; height:32px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    border:none;
    background:transparent;
    color:var(--ink);
    cursor:pointer;
    flex:none;
  }
  .iconbtn:hover{background:var(--border);}
  .iconbtn svg{width:19px;height:19px;}
  .topbar-title{
    font-size:16.5px;
    font-weight:700;
    letter-spacing:-.01em;
    flex:1;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .topbar-title .zh{
    display:block;
    font-size:10.5px;
    font-weight:500;
    color:var(--ink-faint);
    margin-top:1px;
  }
  .pill-btn{
    border:none;
    border-radius:999px;
    padding:8px 14px;
    font-size:13px;
    font-weight:700;
    background:var(--accent);
    color:var(--accent-contrast);
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:5px;
    white-space:nowrap;
    flex:none;
  }
  .pill-btn:hover{filter:brightness(1.06);}
  .pill-btn:focus-visible, .iconbtn:focus-visible, .ghost-btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .pill-btn svg{width:14px;height:14px;}

  .content{padding:16px 18px 28px;}

  .home-hero{padding:20px 18px 6px;}
  .wordmark{
    font-size:27px;
    font-weight:800;
    letter-spacing:-.02em;
    color:var(--ink);
  }
  .wordmark .dot{color:var(--accent);}
  .tagline{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .proto-note{
    font-size:11px;
    color:var(--ink-faint);
    margin-top:8px;
  }

  .search-wrap{
    margin:16px 18px 4px;
    position:relative;
  }
  .search-wrap svg{
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    width:16px;height:16px; color:var(--ink-faint);
  }
  .search-input{
    width:100%;
    padding:12px 14px 12px 38px;
    border-radius:14px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink);
    font-size:14px;
    font-family:inherit;
  }
  .search-input::placeholder{color:var(--ink-faint);}
  .search-input:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}

  .section-label{
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    letter-spacing:.03em;
    margin:22px 18px 10px;
  }

  .cat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    padding:0 18px;
  }
  .cat-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    padding:14px;
    text-align:left;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:8px;
    font-family:inherit;
    color:var(--ink);
  }
  .cat-card:hover{border-color:var(--accent);}
  .cat-card.is-soon{opacity:.62; cursor:default;}
  .cat-icon{
    width:36px; height:36px;
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    background:var(--accent-soft);
    color:var(--accent);
  }
  .cat-card.is-soon .cat-icon{background:var(--border); color:var(--ink-faint);}
  .cat-icon svg{width:19px;height:19px;}
  .cat-name{font-size:14.5px; font-weight:700;}
  .cat-sub{font-size:11px; color:var(--ink-faint); margin-top:-4px;}
  .cat-state{
    font-size:10.5px;
    font-weight:700;
    padding:3px 8px;
    border-radius:999px;
    width:fit-content;
    background:var(--jade-soft);
    color:var(--jade);
  }
  .cat-card.is-soon .cat-state{background:var(--border); color:var(--ink-faint);}

  .qlist{padding:0 18px; display:flex; flex-direction:column; gap:10px;}
  .qcard{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:14px;
    cursor:pointer;
    text-align:left;
    font-family:inherit;
    color:var(--ink);
    display:block;
    width:100%;
  }
  .qcard:hover{border-color:var(--accent);}
  .qcard-title{font-size:14.5px; font-weight:700; line-height:1.4;}
  .qcard-snippet{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:4px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .qcard-meta{
    display:flex; align-items:center; gap:10px;
    margin-top:10px;
    font-size:11.5px;
    color:var(--ink-faint);
  }
  .qcard-meta span{display:inline-flex; align-items:center; gap:4px;}
  .qcard-meta svg{width:13px;height:13px;}
  .badge-adopted{
    display:inline-flex; align-items:center; gap:3px;
    background:var(--jade-soft); color:var(--jade);
    padding:2px 8px; border-radius:999px;
    font-size:10.5px; font-weight:700;
  }
  .badge-adopted svg{width:11px;height:11px;}
  .badge-waiting{
    background:var(--border); color:var(--ink-faint);
    padding:2px 8px; border-radius:999px;
    font-size:10.5px; font-weight:700;
  }

  .empty-state{
    margin:30px 18px; padding:26px 18px;
    text-align:center;
    color:var(--ink-faint);
    font-size:12.5px;
    border:1px dashed var(--border);
    border-radius:16px;
  }

  .field-label{font-size:12.5px; font-weight:700; color:var(--ink-soft); margin:18px 0 6px;}
  select.field, input.field, textarea.field{
    width:100%;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink);
    font-family:inherit;
    font-size:14px;
    padding:11px 13px;
  }
  select.field:focus-visible, input.field:focus-visible, textarea.field:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  textarea.field{resize:vertical; min-height:100px; line-height:1.55;}
  .field::placeholder{color:var(--ink-faint);}

  .suggest-box{margin-top:8px; display:flex; flex-direction:column; gap:6px;}
  .suggest-item{
    display:flex; align-items:center; gap:8px;
    background:var(--accent-soft);
    color:var(--ink);
    border:none;
    border-radius:10px;
    padding:9px 11px;
    font-size:12.5px;
    text-align:left;
    cursor:pointer;
    font-family:inherit;
  }
  .suggest-item svg{width:13px;height:13px; color:var(--accent); flex:none;}
  .suggest-label{font-size:11px; color:var(--ink-faint); margin-top:14px;}

  .submit-row{margin-top:22px;}
  .submit-btn{
    width:100%;
    border:none; border-radius:14px;
    padding:14px;
    background:var(--accent);
    color:var(--accent-contrast);
    font-size:15px; font-weight:800;
    cursor:pointer;
  }
  .submit-btn:disabled{opacity:.4; cursor:not-allowed;}
  .submit-btn:not(:disabled):hover{filter:brightness(1.06);}

  .q-detail-head{padding:4px 18px 16px; border-bottom:1px solid var(--border);}
  .q-detail-cat{
    display:inline-block;
    font-size:10.5px; font-weight:700;
    color:var(--accent);
    background:var(--accent-soft);
    padding:3px 9px; border-radius:999px;
    margin-bottom:10px;
  }
  .q-detail-title{font-size:18.5px; font-weight:800; line-height:1.4; text-wrap:balance;}
  .author-row{display:flex; align-items:center; gap:9px; margin-top:14px;}
  .avatar{
    width:34px; height:34px; border-radius:50%;
    background:var(--ink); color:var(--app-bg);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:800; flex:none;
  }
  .author-name{font-size:13px; font-weight:700;}
  .author-tag{font-size:11px; color:var(--ink-faint); font-weight:500;}
  .author-time{font-size:11px; color:var(--ink-faint); margin-top:1px;}
  .q-detail-body{
    font-size:14px; line-height:1.75; color:var(--ink);
    margin:14px 18px 0; white-space:pre-wrap;
  }
  .q-detail-stats{
    display:flex; gap:14px; margin:14px 18px 0;
    font-size:11.5px; color:var(--ink-faint);
  }
  .q-detail-stats span{display:inline-flex; align-items:center; gap:4px;}
  .q-detail-stats svg{width:13px;height:13px;}

  .answers-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 18px 10px;
  }
  .answers-count{font-size:13.5px; font-weight:800;}
  .answer-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:14px;
    margin:0 18px 10px;
    position:relative;
  }
  .answer-card.is-hot{border-color:var(--jade);}
  .answer-top{display:flex; align-items:flex-start; gap:9px; justify-content:space-between;}
  .answer-who{display:flex; gap:9px;}
  .answer-body{
    font-size:13.5px; line-height:1.7; color:var(--ink);
    margin:10px 0 0; white-space:pre-wrap;
  }
  .answer-actions{
    display:flex; align-items:center; gap:10px; margin-top:12px;
  }
  .like-btn{
    display:inline-flex; align-items:center; gap:5px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--ink-soft);
    border-radius:999px;
    padding:6px 11px;
    font-size:12px; font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .like-btn:hover{border-color:var(--accent); color:var(--accent);}
  .like-btn svg{width:13px;height:13px;}
  .resolve-btn{
    border:1px solid var(--jade);
    background:transparent;
    color:var(--jade);
    border-radius:999px;
    padding:6px 12px;
    font-size:12px; font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .resolve-btn:hover{background:var(--jade-soft);}

  .stamp{
    flex:none;
    display:flex; align-items:center; gap:4px;
    border:1.5px dashed var(--jade);
    color:var(--jade);
    border-radius:999px;
    padding:4px 10px 4px 8px;
    font-size:10.5px; font-weight:800;
    transform:rotate(-7deg);
  }
  .stamp svg{width:11px;height:11px;}

  .composer{
    position:sticky; bottom:0;
    background:var(--app-bg);
    border-top:1px solid var(--border);
    padding:12px 18px 16px;
    margin-top:auto;
  }
  .composer textarea{margin-bottom:8px;}

  .toast{
    position:absolute;
    left:50%; bottom:80px;
    transform:translateX(-50%);
    background:var(--ink);
    color:var(--app-bg);
    font-size:12.5px; font-weight:600;
    padding:10px 16px;
    border-radius:999px;
    box-shadow:0 10px 24px var(--shadow);
    z-index:20;
    animation:toastIn .2s ease;
    white-space:nowrap;
  }
  @keyframes toastIn{ from{opacity:0; transform:translate(-50%,8px);} to{opacity:1; transform:translate(-50%,0);} }

  .profile-card{
    margin:6px 18px 4px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
    text-align:center;
  }
  .profile-avatar{
    width:56px;height:56px;border-radius:50%;
    background:var(--ink); color:var(--app-bg);
    display:flex; align-items:center; justify-content:center;
    font-size:20px; font-weight:800;
    margin:0 auto 10px;
  }
  .profile-name{font-size:16px; font-weight:800;}
  .profile-tag{font-size:12px; color:var(--ink-faint); margin-top:2px;}
  .stat-row{
    display:flex; margin-top:16px;
    border-top:1px solid var(--border);
    padding-top:14px;
  }
  .stat{flex:1;}
  .stat b{display:block; font-size:16px; font-variant-numeric:tabular-nums;}
  .stat span{font-size:11px; color:var(--ink-faint);}

  .tabs{display:flex; gap:6px; margin:20px 18px 12px; border-bottom:1px solid var(--border);}
  .tab-btn{
    border:none; background:transparent;
    font-family:inherit; font-size:13px; font-weight:700;
    color:var(--ink-faint);
    padding:9px 4px; margin-right:14px;
    cursor:pointer;
    border-bottom:2px solid transparent;
  }
  .tab-btn.is-active{color:var(--ink); border-color:var(--accent);}

  .notif-item{
    display:flex; gap:10px; align-items:flex-start;
    padding:12px 18px;
    border-bottom:1px solid var(--border);
    font-size:13px;
  }
  .notif-item svg{width:16px;height:16px; color:var(--accent); flex:none; margin-top:1px;}
  .notif-time{font-size:11px; color:var(--ink-faint); margin-top:2px;}

  .mylist-item{
    padding:13px 18px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
    background:transparent;
    border-left:none;border-right:none;border-top:none;
    width:100%; text-align:left; font-family:inherit; color:var(--ink);
  }
  .mylist-item:hover{background:var(--surface);}
  .mylist-q{font-size:11px; color:var(--ink-faint); margin-bottom:3px;}
  .mylist-a{font-size:13px; line-height:1.55; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}

  .bottomnav{
    display:flex;
    border-top:1px solid var(--border);
    background:var(--app-bg);
    padding:8px 6px 14px;
    flex:none;
    position:relative;
    z-index:3;
  }
  .bn-item{
    flex:1;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    background:transparent; border:none;
    color:var(--ink-faint);
    font-family:inherit; font-size:10px; font-weight:700;
    padding:4px 2px;
    cursor:pointer;
  }
  .bn-item svg{width:20px;height:20px;}
  .bn-item.is-active{color:var(--accent);}
  .bn-item:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .bn-item.is-center{position:relative; top:-14px;}
  .bn-item.is-center .bn-center-circle{
    width:46px; height:46px; border-radius:50%;
    background:var(--accent); color:var(--accent-contrast);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 16px -4px var(--shadow);
    margin-bottom:2px;
  }
  .bn-item.is-center .bn-center-circle svg{width:22px;height:22px;}

  .role-grid{display:flex; flex-direction:column; gap:10px; margin-top:6px;}
  .role-card{
    background:var(--surface); border:1px solid var(--border); border-radius:18px;
    padding:16px; text-align:left; cursor:pointer; font-family:inherit; color:var(--ink);
    display:flex; flex-direction:column; gap:6px;
  }
  .role-card:hover{border-color:var(--accent);}

  .verify-banner{
    margin:16px 18px 4px;
    background:var(--accent-soft);
    border:1px solid var(--accent);
    border-radius:16px;
    padding:14px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .verify-banner b{font-size:13px;}
  .verify-banner-sub{font-size:11px; color:var(--ink-soft); margin-top:2px;}

  .owner-badge{
    display:inline-flex; align-items:center; gap:3px;
    font-size:10.5px; font-weight:700;
    color:var(--accent);
    background:var(--accent-soft);
    padding:2px 7px; border-radius:999px;
  }
  .owner-badge svg{width:10px;height:10px;}

  .filter-chips{display:flex; flex-wrap:wrap; gap:8px; padding:0 18px; margin-top:14px;}
  .filter-select-row{padding:10px 18px 0;}
  .chip-toggle-row{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    border:1px solid var(--border); background:var(--surface); color:var(--ink);
    border-radius:999px; padding:8px 13px; font-size:12.5px; font-weight:700;
    cursor:pointer; font-family:inherit;
    display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  .chip small{font-size:10px; font-weight:500; color:var(--ink-faint);}
  .chip.is-active{border-color:var(--accent); background:var(--accent-soft); color:var(--accent);}
  .chip.is-active small{color:var(--accent);}
  .chip:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .card-author-row{
    display:flex; align-items:center; gap:6px;
    background:transparent; border:none; padding:0 0 8px; margin:0;
    font-family:inherit; cursor:pointer; color:var(--ink-soft);
    font-size:11.5px; font-weight:700;
  }
  .card-author-row:hover{color:var(--accent);}
  .card-author-row:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  /* ===== 로그인 · 회원가입 ===== */
  .auth-wrap{flex:1; display:flex; flex-direction:column; padding:52px 22px 30px;}
  .auth-hero{display:flex; flex-direction:column; align-items:center; text-align:center; gap:24px;}
  .logo-lockup{display:flex; align-items:flex-end; gap:5px; color:var(--ink);}
  .logo-col{display:flex; flex-direction:column; align-items:flex-end;}
  .logo-ko, .logo-zh{height:50px; display:flex; align-items:center; line-height:1;}
  .logo-ko{font-family:"Jua",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; font-size:48px;}
  .logo-zh{font-family:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif; font-size:45px;}
  .logo-bubble{
    position:relative;
    display:flex; flex-direction:column; align-items:center;
    padding:5px 8px 0;
    background:var(--hl);
    border-radius:15px;
  }
  .logo-check{
    position:absolute; top:-18px; right:-19px;
    width:34px; height:34px; border-radius:50%;
    background:var(--accent); color:var(--accent-contrast);
    border:4px solid var(--app-bg);
    display:flex; align-items:center; justify-content:center;
  }
  .logo-check svg{width:17px; height:17px; stroke-width:3.2;}
  .logo-tail{position:absolute; right:13px; bottom:-15px; width:22px; height:17px; fill:var(--hl);}
  .auth-tagline{font-size:15px; font-weight:800; line-height:1.4;}
  .auth-tagline .zh{display:block; font-size:12.5px; font-weight:500; color:var(--ink-soft); margin-top:3px;}
  .auth-form{margin-top:26px;}
  label.field-label{display:block;}
  .text-link{
    background:none; border:none; padding:12px 8px;
    font-family:inherit; font-size:12.5px; color:var(--ink-soft);
    text-decoration:underline; cursor:pointer;
  }
  .text-link:focus-visible, .outline-btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .auth-foot{margin-top:auto; padding-top:18px; border-top:1px solid var(--border); text-align:center;}
  .auth-foot-label{font-size:12.5px; color:var(--ink-soft); margin-bottom:10px;}
  .outline-btn{
    width:100%;
    border:1.5px solid var(--ink); border-radius:14px;
    padding:13px;
    background:transparent; color:var(--ink);
    font-family:inherit; font-size:15px; font-weight:800;
    cursor:pointer;
  }
  .step-count{font-size:12px; font-weight:700; color:var(--ink-faint); flex:none;}
  .step-bar{display:flex; gap:6px; padding:12px 18px 0;}
  .step-bar span{flex:1; height:4px; border-radius:2px; background:var(--border);}
  .step-bar span.is-done{background:var(--accent);}
  .auth-title{font-size:20px; font-weight:800; line-height:1.35; letter-spacing:-.02em; text-wrap:balance;}
  .auth-sub{font-size:12.5px; color:var(--ink-soft); margin-top:5px; line-height:1.5;}
  .field-help{font-size:11px; color:var(--ink-faint); margin-top:6px; line-height:1.5;}
  .field-error{font-size:11.5px; color:var(--accent); font-weight:700; margin-top:6px;}
  .field-error:empty{display:none;}
  .info-note{background:var(--accent-soft); border-radius:12px; padding:12px 13px; margin-top:18px; font-size:12px; line-height:1.55;}
  .info-note b{display:block; font-size:12.5px; margin-bottom:2px;}
  .agree-row{display:flex; align-items:center; gap:6px; margin-top:16px;}
  .agree-row label{flex:1; min-height:44px; display:flex; align-items:center; gap:9px; font-size:13px; font-weight:600; cursor:pointer;}
  .agree-row input{width:20px; height:20px; margin:0; flex:none; accent-color:var(--accent);}
  .agree-row .req{color:var(--accent); font-weight:800;}

  /* ===== 새 디자인 적용 (기존 규칙을 덮어써요) ===== */
  button, input, select, textarea{font-family:inherit;}
  .logo-lockup.is-sm{gap:3px;}
  .logo-lockup.is-sm .logo-ko, .logo-lockup.is-sm .logo-zh{height:24px;}
  .logo-lockup.is-sm .logo-ko{font-size:23px;}
  .logo-lockup.is-sm .logo-zh{font-size:21px;}
  .logo-lockup.is-sm .logo-bubble{padding:2px 5px 0; border-radius:8px;}
  .logo-lockup.is-sm .logo-check{top:-8px; right:-10px; width:18px; height:18px; border-width:2px;}
  .logo-lockup.is-sm .logo-check svg{width:9px; height:9px; stroke-width:4;}
  .logo-lockup.is-sm .logo-tail{right:7px; bottom:-7px; width:11px; height:9px;}

  .home-hero{padding:22px 18px 4px;}
  .home-hero .logo-lockup{margin-bottom:22px;}
  .home-headline{margin:0; font-size:23px; font-weight:700; line-height:1.34; letter-spacing:-.02em;}
  .hl{background:linear-gradient(transparent 58%, var(--hl) 58%);}
  .tagline{font-size:13px; margin-top:6px;}

  .pill-btn{min-height:40px; padding:9px 16px;}
  .submit-btn{min-height:54px; font-weight:700;}
  select.field, input.field, textarea.field{min-height:50px; padding:13px 14px; font-size:15px; border-color:var(--line-strong);}
  textarea.field{min-height:110px;}
  .field-label{font-size:13.5px; color:var(--ink);}

  .chip{min-height:42px; padding:7px 15px; font-size:13px; font-weight:600; justify-content:center; border-color:var(--line-strong);}
  .chip.is-active{border-color:var(--ink); background:var(--ink); color:var(--app-bg);}
  .chip.is-active small{color:var(--app-bg); opacity:.8;}
  .lvl{display:inline-flex; align-items:flex-end; gap:3px; flex:none;}
  .lvl i{display:block; width:4px; border-radius:2px; background:currentColor; opacity:.28;}
  .lvl i:nth-child(1){height:7px;} .lvl i:nth-child(2){height:10px;} .lvl i:nth-child(3){height:13px;}
  .lvl i.on{opacity:1;}
  .filter-title{font-size:13.5px; font-weight:600; padding:0 18px; margin-top:18px;}
  .level-seg{display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:8px; padding:0 18px; margin-top:8px;}
  .level-seg .chip{flex-direction:row; align-items:center; gap:8px; min-height:46px; border-radius:12px; font-size:14px;}
  .screen > *{flex-shrink:0;}
  .industry-scroll{flex:none; display:flex; gap:8px; overflow-x:auto; padding:12px 18px 6px; scrollbar-width:none; -webkit-overflow-scrolling:touch;}
  .industry-scroll::-webkit-scrollbar{display:none;}
  .industry-scroll .chip{flex:none; white-space:nowrap; font-weight:500;}
  .industry-scroll .chip.is-active{border-color:var(--accent); background:var(--accent); color:var(--accent-contrast); font-weight:600;}

  .section-label{font-size:16px; color:var(--ink); letter-spacing:0; margin:24px 18px 12px;}
  .qcard{padding:16px;}
  .qcard-title{font-size:16px; line-height:1.4;}
  .qcard-snippet{font-size:13px; margin-top:5px;}
  .qcard-status{margin-bottom:8px;}
  .badge-adopted{background:var(--accent); color:var(--accent-contrast); border-radius:6px; padding:3px 8px; font-size:11px;}
  .badge-waiting{background:transparent; border:1px solid var(--ink-soft); color:var(--ink-soft); border-radius:6px; padding:2px 8px; font-size:11px;}
  .tag{display:inline-block; padding:3px 8px; border-radius:6px; background:var(--chip-bg); font-size:11.5px; font-weight:600;}
  .career-badge{display:inline-block; flex:none; padding:2px 9px; border:1px solid var(--accent); border-radius:999px; font-size:11px; font-weight:600; color:var(--accent); white-space:nowrap;}
  .rcard-top{display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:11.5px; color:var(--ink-soft);}
  .rcard-top .rcard-stats{margin-left:auto; display:inline-flex; align-items:center; gap:10px; color:var(--ink-faint);}
  .rcard-top .rcard-stats span{display:inline-flex; align-items:center; gap:4px;}
  .rcard-top svg{width:13px; height:13px;}
  .rcard-body{font-size:13.5px; line-height:1.6; color:var(--ink-soft); margin-top:5px; text-wrap:pretty;}
  .lvl-pill{display:inline-flex; align-items:center; gap:7px; margin-top:10px; padding:6px 10px; border-radius:8px; background:var(--accent-soft); font-size:12.5px; font-weight:600;}
  .rcard-foot{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:12px; padding-top:10px; border-top:1px solid var(--border);}
  .rcard-foot .card-author-row{padding:0; min-height:28px;}

  .q-detail-cat{background:var(--ink); color:var(--app-bg); border-radius:6px; font-size:11.5px; padding:3px 8px;}
  .q-detail-title{font-size:21px; font-weight:700; letter-spacing:-.02em;}
  .detail-chips{display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-bottom:10px;}
  .detail-chips .q-detail-cat{margin-bottom:0;}
  .avatar, .profile-avatar{background:var(--chip-bg); color:var(--ink);}
  .facts{display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); margin:6px 18px 0; background:var(--surface); border:1px solid var(--border); border-radius:16px;}
  .facts > div{padding:13px 8px; display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center;}
  .facts > div + div{border-left:1px solid var(--border);}
  .facts span{font-size:11.5px; color:var(--ink-soft);}
  .facts b{font-size:13.5px; font-weight:700; line-height:1.35;}
  .hl-block{background:var(--hl); border-radius:14px; padding:14px 16px;}
  .hl-block b{display:block; font-size:13.5px;}
  .hl-block p{margin:4px 0 0; font-size:14px; line-height:1.6;}
  .detail-h{font-size:14.5px; font-weight:700; margin:20px 0 6px;}
  .author-card{display:flex; align-items:center; gap:10px; margin-top:22px; padding:14px; background:var(--surface); border:1px solid var(--border); border-radius:16px; cursor:pointer;}
  .author-card > div:nth-child(2){flex:1; min-width:0;}
  .author-card:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .answer-card.is-hot{border:1.5px solid var(--accent);}
  .stamp{border:none; background:var(--accent); color:var(--accent-contrast); border-radius:8px; padding:5px 10px; font-size:11px; transform:none;}
  .like-btn{min-height:40px; padding:0 13px;}
  .resolve-btn{flex:1; min-height:40px; padding:0 14px; border:1.5px solid var(--accent); border-radius:12px; color:var(--accent); font-size:13px;}
  .resolve-btn:hover{background:var(--accent-soft);}

  .bottomnav{background:var(--surface);}
  .bn-item{color:var(--ink-soft); font-size:10.5px; font-weight:500;}
  .bn-item.is-active{color:var(--ink); font-weight:700;}
  .bn-icon{width:46px; height:28px; border-radius:14px; display:flex; align-items:center; justify-content:center;}
  .bn-item.is-active .bn-icon{background:var(--hl);}

  /* ===== 언어 전환 (예시) ===== */
  :root[lang="zh-CN"] body{font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei","IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
  .lang-btn{
    flex:none; display:inline-flex; align-items:center; gap:6px;
    min-height:40px; padding:0 13px;
    border:1px solid var(--line-strong); border-radius:999px;
    background:var(--surface); color:var(--ink);
    font-size:13px; font-weight:600; cursor:pointer;
  }
  .lang-btn svg{width:16px; height:16px;}
  .lang-btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .lang-row{display:flex; justify-content:flex-end; margin:-30px -4px 18px;}
  .hero-top{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:22px;}
  .home-hero .hero-top .logo-lockup{margin-bottom:0;}
  .translated-note{display:block; margin-top:6px; font-size:11px; font-weight:400; color:var(--ink-faint);}

  @media (max-width:560px){
    body{padding:0; align-items:stretch;}
    .stage{max-width:none; min-height:100vh;}
    .backdrop-deco,.postmark,.brandmark{display:none;}
    .phone{
      width:100vw; height:100vh; height:100dvh;
      border-radius:0; padding:0; box-shadow:none;
    }
    .phone-notch{display:none;}
    .phone-screen{border-radius:0;}
    .home-indicator{display:none;}
  }

  /* 태블릿 너비(561~899px): 휴대폰 모형 없이 가운데 한 줄로 보여요 */
  @media (min-width:561px) and (max-width:899px){
    body{padding:0; align-items:stretch;}
    .stage{max-width:none; min-height:100vh;}
    .backdrop-deco, .postmark, .brandmark, .phone-notch, .home-indicator{display:none;}
    .phone{width:100vw; height:100vh; height:100dvh; border-radius:0; padding:0; box-shadow:none; background:var(--backdrop);}
    .phone-screen{border-radius:0; max-width:560px; margin:0 auto; border-inline:1px solid var(--border);}
  }

  /* ===== PC 버전 (창 너비 900px 이상) =====
     같은 파일이 창 너비에 따라 모양을 바꿔요. 좁으면 지금까지의 모바일 화면 그대로예요. */
  .topnav{display:none;}
  .filter-title-industry{display:none;}
  .fact-desktop{display:none !important;}
  .detail-aside{padding:0 18px 28px;}

  @media (min-width:900px){
    body{padding:0; align-items:stretch;}
    .stage{max-width:none; min-height:100vh;}
    .backdrop-deco, .postmark, .brandmark, .phone-notch, .home-indicator{display:none;}
    .phone{width:100vw; height:100vh; border-radius:0; padding:0; box-shadow:none; background:var(--app-bg);}
    .phone-screen{border-radius:0;}
    .bottomnav{display:none;}
    .toast{bottom:40px;}

    /* 상단 메뉴 */
    .topnav{display:block; flex:none; background:var(--surface); border-bottom:1px solid var(--border);}
    .topnav-inner{max-width:1120px; margin:0 auto; padding:12px 18px 10px; display:flex; align-items:center; gap:28px;}
    .topnav-logo{background:none; border:none; padding:6px 10px 6px 0; color:inherit; cursor:pointer;}
    .topnav-logo:focus-visible, .tn-item:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
    .topnav .logo-check{border-color:var(--surface);}
    .topnav-links{flex:1; display:flex; align-items:center; gap:4px;}
    .tn-item{height:42px; padding:0 16px; border:none; border-radius:21px; background:transparent; color:var(--ink-soft); font-size:15px; font-weight:500; cursor:pointer;}
    .tn-item:hover{background:var(--chip-bg);}
    .tn-item.is-active{background:var(--hl); color:var(--ink); font-weight:700;}
    .topnav-actions{display:flex; align-items:center; gap:10px;}
    .tn-cta{min-height:42px; padding:0 18px; font-size:14px;}

    /* 본문은 가운데 한 줄(기본 760px). 홈과 후기 상세는 넓게, 로그인·가입은 좁게 */
    .screen{--col:760px; padding-inline:max(0px, calc((100% - var(--col)) / 2));}
    .screen.view-feed, .screen.view-reviewDetail{--col:1120px;}
    .screen.view-login, .screen.view-signup1, .screen.view-signup2, .screen.view-signup3, .screen.view-onboarding,
    .screen.view-privacy, .screen.view-newPassword, .screen.view-loading, .screen.view-setup, .screen.view-loadError{--col:460px;}
    .hero-top{display:none;}
    .topbar .lang-btn{display:none;}
    .topbar{padding-top:20px;}

    /* 로그인: 가운데 카드 */
    .auth-wrap{flex:none; margin:48px 0; padding:40px 36px 32px; background:var(--surface); border:1px solid var(--border); border-radius:20px;}
    .auth-wrap .lang-row{margin:-18px -12px 18px;}
    .auth-wrap .logo-check{border-color:var(--surface);}
    .auth-foot{margin-top:24px;}

    /* 홈: 왼쪽 필터 + 오른쪽 후기 카드 */
    .view-feed .home-hero{padding:40px 18px 28px;}
    .view-feed .home-headline{font-size:34px;}
    .view-feed .home-headline br{display:none;}
    :root:not([lang="zh-CN"]) .view-feed .home-headline .hl{margin-left:.28em;}
    .view-feed .tagline{font-size:16px;}
    .feed-layout{display:flex; align-items:flex-start; gap:32px; padding:0 18px 48px;}
    .filter-panel{flex:0 0 280px; position:sticky; top:16px; padding:20px; background:var(--surface); border:1px solid var(--border); border-radius:16px;}
    .filter-panel .filter-title{padding:0; margin-top:0;}
    .filter-panel .level-seg{padding:0; gap:6px; margin-top:10px;}
    .filter-panel .level-seg .chip{padding:7px 6px; gap:6px;}
    .filter-panel .filter-title-industry{display:block; margin-top:24px;}
    .filter-panel .industry-scroll{flex-wrap:wrap; overflow:visible; gap:6px; padding:10px 0 0;}
    #feedBody{flex:1; min-width:0;}
    .view-feed .section-label{margin:0 0 16px; font-size:18px;}
    .view-feed .qlist{padding:0; display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:16px;}
    .view-feed .qcard{display:flex; flex-direction:column; padding:18px;}
    .view-feed .lvl-pill{align-self:flex-start; margin-bottom:12px;}
    .view-feed .rcard-foot{margin-top:auto;}
    .view-feed .empty-state{grid-column:1 / -1; margin:0;}

    /* 후기 상세: 가운데 본문 + 오른쪽 작성자 카드 */
    .detail-layout{display:flex; align-items:flex-start; gap:14px; padding:16px 0 48px;}
    .detail-main{flex:1; min-width:0;}
    .detail-aside{flex:0 0 320px; position:sticky; top:84px; padding:0 18px 0 0;}
    .detail-aside .author-card{margin-top:4px; flex-wrap:wrap;}
    .detail-aside .submit-row{margin-top:12px;}
    .view-reviewDetail .q-detail-title{font-size:30px;}
    .view-reviewDetail .facts{grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));}
    .fact-desktop{display:flex !important;}
    .schedule-line{display:none;}
    .view-reviewDetail .hl-block p{font-size:17px;}
    .view-reviewDetail .answer-body{font-size:15px;}
  }

function ago(iso){
  const sec = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if(!(sec >= 60)) return '방금 전';
  if(sec < 3600) return Math.floor(sec/60) + '분 전';
  if(sec < 86400) return Math.floor(sec/3600) + '시간 전';
  if(sec < 86400*7) return Math.floor(sec/86400) + '일 전';
  if(sec < 86400*30) return Math.floor(sec/(86400*7)) + '주 전';
  if(sec < 86400*365) return Math.floor(sec/(86400*30)) + '개월 전';
  return Math.floor(sec/(86400*365)) + '년 전';
}
function personOf(row){
  // 기존 화면이 학과 자리에 dept를 보여 주기 때문에, 그 자리에 대학교 이름을 넣어요
  return {id:row.author_id, name:row.author_name, dept:row.author_univ, year:row.author_year, stay:row.author_stay};
}

async function loadAll(isRetry){
  const uid = ME_STUDENT.id;
  const startedAt = mutations;
  try{
    const res = await Promise.all([
      sb.from('profiles').select('id,nickname,univ,year,stay').eq('id', uid).maybeSingle(),
      sb.from('review_feed').select('*').order('created_at', {ascending:false}).limit(300),
      sb.from('question_feed').select('*').order('created_at', {ascending:false}).limit(300),
      sb.from('answer_likes').select('answer_id'),
      sb.from('review_likes').select('review_id')
    ]);
    const failed = res.find(r=>r.error);
    if(failed) throw failed.error;
    if(ME_STUDENT.id !== uid) return false;                       // 불러오는 사이에 로그아웃함
    if(startedAt !== mutations && !isRetry) return loadAll(true);  // 그 사이 좋아요를 눌렀으면 한 번 더
    const [me, rv, qs, al, rl] = res.map(r=>r.data);
    if(!me) throw new Error('profile-missing');

    const people = new Map();
    const keep = p => { if(!people.has(p.id)) people.set(p.id, p); return people.get(p.id); };
    keep({id:me.id, name:me.nickname, dept:me.univ, year:me.year, stay:me.stay});

    REVIEWS = rv.map(r=>{
      keep(personOf(r));
      return {id:r.id, industry:r.industry, shopName:r.shop_name || '', days:r.days || [], timeOfDay:r.time_of_day || '',
              korean:r.korean, months:r.months, good:r.good, hard:r.hard, note:r.note || '', tip:r.tip,
              authorId:r.author_id, createdAt:r.created_at, time:ago(r.created_at), views:r.views, likes:r.likes};
    });
    QUESTIONS = qs.map(q=>{
      const answers = (q.answers || []).map(a=>({
        id:a.id, author:keep(personOf(a)), body:a.body, likes:a.likes, createdAt:a.created_at, time:ago(a.created_at)
      }));
      const idx = q.resolved_answer_id ? answers.findIndex(a=>a.id===q.resolved_answer_id) : -1;
      return {id:q.id, cat:q.cat, title:q.title, body:q.body, author:keep(personOf(q)),
              createdAt:q.created_at, time:ago(q.created_at), views:q.views, answers,
              resolved: idx >= 0, resolvedIdx: idx >= 0 ? idx : null, resolvedAt:q.resolved_at};
    });
    STUDENTS = Array.from(people.values());
    LIKED_ANSWERS = new Set(al.map(x=>x.answer_id));
    LIKED_REVIEWS = new Set(rl.map(x=>x.review_id));
    lastLoadAt = Date.now();
    lastLoadError = '';
    return true;
  }catch(e){
    console.error('[무로바] 불러오기 실패', e);
    lastLoadError = (e && (e.message || e.code)) || String(e);
    return false;
  }
}

// 사용자가 쓴 글의 번역 자리. 지금은 비어 있어서 글은 쓴 언어 그대로 보여요. (번역 API를 붙이면 여기를 채우면 돼요)
const CONTENT_ZH = {};

function tc(s){ return (isZh() && CONTENT_ZH[s]) || s; }
function translatedNote(){
  // 넘겨받은 원문 중 하나라도 번역본을 보여 주고 있으면 표시해요
  const shown = isZh() && Array.from(arguments).some(o=>CONTENT_ZH[o]);
  return shown ? `<span class="translated-note">${t('번역됨 (예시)')}</span>` : '';
}
function titleHTML(ko, zh){ return isZh() ? zh : `${ko}<span class="zh">${zh}</span>`; }
function displayName(name){ return name==='익명' ? t('익명') : name; }
function catName(c){ return isZh() ? c.zh : c.name; }
function timeText(s){
  if(!isZh()) return s;
  if(s==='방금 전') return '刚刚';
  const m = String(s).match(/^(\d+)(분|시간|일|주|개월|년) 전$/);
  return m ? m[1] + {'분':'分钟','시간':'小时','일':'天','주':'周','개월':'个月','년':'年'}[m[2]] + '前' : s;
}
function stayText(s){
  if(!isZh() || !s) return s;
  if(I18N_ZH[s]) return I18N_ZH[s];
  let m = String(s).match(/^(\d+)개월$/); if(m) return m[1]+'个月';
  m = String(s).match(/^(\d+)년 이상$/); if(m) return m[1]+'年以上';
  return s;
}
function profileTag(s){
  return `${esc(t(s.dept))} · ${esc(t(s.year))} · ${t('체류 {stay}', {stay:esc(stayText(s.stay))})}`;
}
function scheduleText(r){
  const days = r.days.map(d=>t(d)).join(isZh() ? '、' : '');
  const time = r.timeOfDay ? ' · ' + t(r.timeOfDay) : '';
  return isZh() ? days + time : `${days}${time} 근무`;
}

function detectLang(){
  try{
    const saved = localStorage.getItem('muroba-lang');
    if(saved==='ko' || saved==='zh') return saved;
  }catch(e){}
  // 휴대폰·브라우저 언어가 중국어면 처음부터 중국어로 열어요
  return (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'ko';
}
function isZh(){ return state.lang==='zh'; }
function t(ko, vars){
  let s = (isZh() && I18N_ZH[ko]) || ko;
  if(vars) Object.keys(vars).forEach(k=>{ s = s.replace('{'+k+'}', ()=>vars[k]); });
  return s;
}
function careerText(totalMonths){
  if(!isZh()) return formatCareer(totalMonths);
  if(totalMonths < 12) return `${totalMonths}个月`;
  const years = Math.floor(totalMonths/12), months = totalMonths % 12;
  return months ? `${years}年${months}个月` : `${years}年`;
}
function applyLang(){
  document.documentElement.lang = isZh() ? 'zh-CN' : 'ko';
}
function toggleLang(){
  // 로그인 화면에서 입력하던 값은 언어를 바꿔도 남겨 둬요
  const email = document.getElementById('loginEmail'), pw = document.getElementById('loginPw');
  const keep = email && pw ? {email:email.value, pw:pw.value} : null;
  state.lang = isZh() ? 'ko' : 'zh';
  try{ localStorage.setItem('muroba-lang', state.lang); }catch(e){}
  applyLang();
  render();
  if(keep && document.getElementById('loginEmail')){
    document.getElementById('loginEmail').value = keep.email;
    document.getElementById('loginPw').value = keep.pw;
    toggleLoginSubmit();
  }
}

function navigate(view, param, opts){
  opts = opts || {};
  state.view = view;
  state.param = param || null;
  if(view==='mypage') state.tab = state.role==='owner' ? 'listings' : 'reviews';
  if(view==='category') state.catTab = 'questions';
  if(!opts.fromHistory) writeRoute(!!opts.replace);
  if(view==='reviewDetail') countView('review', state.param);
  if(view==='detail') countView('question', state.param);
  document.getElementById('screen').scrollTop = 0;
  render();
  if(LIVE_VIEWS.includes(view)) softRefresh();
}

function countView(kind, id){
  const item = kind==='review' ? REVIEWS.find(r=>r.id===id) : qOf(id);
  if(!sb || !item || viewedOnce.has(id)) return;
  viewedOnce.add(id);
  item.views += 1;
  sb.rpc('add_view', {kind, target:id}).then(()=>{}, ()=>{});
}

/* ===== 주소와 뒤로 가기 =====
   화면이 바뀔 때 주소 끝에 #/화면이름 을 붙여서, 브라우저 뒤로 가기와 링크 공유가 되게 해요. */
const ROUTABLE = ['feed','qa','reviewForm','reviewDetail','userProfile','ask','detail','notifs','mypage'];
function writeRoute(replace){
  const hash = ROUTABLE.includes(state.view) ? '#/' + state.view + (state.param ? '/' + encodeURIComponent(state.param) : '') : '';
  try{
    history[replace ? 'replaceState' : 'pushState']({view:state.view, param:state.param}, '', location.pathname + location.search + hash);
  }catch(e){}
}
function parseHash(){
  const m = (location.hash || '').match(/^#\/([A-Za-z0-9]+)(?:\/(.+))?$/);
  if(!m || !ROUTABLE.includes(m[1])) return null;
  let param = null;
  try{ param = m[2] ? decodeURIComponent(m[2]) : null; }catch(e){}
  return {view:m[1], param};
}
function applyRoute(view, param, replace){
  const opts = replace ? {replace:true} : {fromHistory:true};
  if(!ME_STUDENT.id){
    const allowed = view==='login' || ((/^signup[123]$/.test(view) || view==='privacy') && signupDraft);
    navigate(allowed ? view : 'login', null, opts);
    return;
  }
  if(state.recovering){ navigate('newPassword', null, opts); return; }
  if(!ROUTABLE.includes(view)){ view = 'feed'; param = null; }
  if(view==='ask') param = 'alba';
  navigate(view, param, opts);
}
window.addEventListener('popstate', e=>{
  if(['loading','setup','loadError'].includes(state.view)) return;
  const r = (e.state && e.state.view) ? e.state : (parseHash() || {view: ME_STUDENT.id ? 'feed' : 'login', param:null});
  applyRoute(r.view, r.param, false);
});

function showToast(msg){
  const host = document.getElementById('toastHost');
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  host.innerHTML = '';
  host.appendChild(t);
  setTimeout(()=>{ if(host.contains(t)) host.removeChild(t); }, 2200);
}

function render(){

  if(state.view==='reviewDetail' && !REVIEWS.some(r=>r.id===state.param)){ state.view = 'feed'; state.param = null; }
  if(state.view==='userProfile' && !studentOf(state.param)){ state.view = 'feed'; state.param = null; }

  else if(state.view==='category') el.innerHTML = renderCategory(state.param);
  else if(state.view==='ask') el.innerHTML = renderAsk(state.param);

  else if(state.view==='notifs') el.innerHTML = renderNotifs();
  else if(state.view==='mypage') el.innerHTML = renderMyPage();
  const hideNav = NO_NAV_VIEWS.includes(state.view);
  document.getElementById('bottomNavHost').innerHTML = hideNav ? '' : renderBottomNav();

// Supabase가 돌려준 오류를 화면에 보여 줄 한국어 문구로 바꿔요
function authErrorKey(error){
  const code = (error && error.code) || '';
  const msg = ((error && error.message) || '').toLowerCase();
  if(code==='invalid_credentials' || msg.includes('invalid login')) return '이메일 또는 비밀번호가 맞지 않아요';
  if(code==='email_not_confirmed' || msg.includes('not confirmed')) return '이메일 인증을 먼저 끝내 주세요. 받은 메일의 링크를 누르면 돼요.';
  if(code==='user_already_exists' || code==='email_exists' || msg.includes('already registered')) return '이미 가입한 이메일이에요. 로그인해 주세요.';
  if(code==='same_password') return '새 비밀번호는 이전과 달라야 해요';
  if(code==='weak_password' || msg.includes('password should')) return '비밀번호가 너무 쉬워요. 8자 이상으로 다르게 정해 주세요.';
  if(code.startsWith('over_') || (error && error.status===429)) return '요청이 너무 많아요. 잠시 후 다시 시도해 주세요.';
  if(msg.includes('database error')) return '이미 쓰고 있는 닉네임이에요';
  return FAIL_MSG;
}

async function enterSession(user, greet){
  ME_STUDENT.id = user.id;
  ME_STUDENT.email = user.email || '';
  state.role = 'student';
  const ok = await loadAll();
  if(ME_STUDENT.id !== user.id) return;
  if(!ok){ state.view = 'loadError'; render(); return; }
  if(state.recovering){ navigate('newPassword', null, {replace:true}); return; }
  const route = greet ? null : parseHash();
  if(route) applyRoute(route.view, route.param, true);
  else navigate('feed', null, {replace: !greet});
  const me = studentOf(user.id);
  if(greet==='login') showToast(t('{name}님, 다시 만나서 반가워요', {name:me.name}));
  if(greet==='signup') showToast(t('{name}님, 가입을 환영해요', {name:me.name}));
}

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pw = document.getElementById('loginPw').value;
  if(!EMAIL_RE.test(email) || !pw) return;
  setAuthNotice(null);
  await withBusy('loginBtn', async ()=>{
    const {data, error} = await sb.auth.signInWithPassword({email, password:pw});
    if(error){ setAuthNotice(authErrorKey(error), false); return; }
    await enterSession(data.user, 'login');
  });
}

async function logout(){
  clearLocal();
  state.role = 'student';
  authNotice = null;
  navigate('login');
  showToast(t('로그아웃했어요'));
  try{ await sb.auth.signOut(); }catch(e){}
}

async function deleteAccount(){
  if(!confirm(t('탈퇴하면 계정과 내가 쓴 후기·질문·답변이 모두 삭제되고 되돌릴 수 없어요. 정말 탈퇴할까요?'))) return;
  await withBusy(null, async ()=>{
    const {error} = await sb.rpc('delete_my_account');
    if(error) throw error;
    clearLocal();
    try{ await sb.auth.signOut({scope:'local'}); }catch(e){}
    authNotice = null;
    navigate('login');
    showToast(t('탈퇴했어요. 그동안 이용해 주셔서 고마워요.'));
  });
}

function saveSignup1(){
  const email = document.getElementById('suEmail');
  if(!email || !signupDraft) return;
  signupDraft.email = email.value.trim();
  signupDraft.password = document.getElementById('suPw').value;
  signupDraft.nickname = document.getElementById('suNick').value.trim();
  signupDraft.birth = document.getElementById('suBirth').value;
}

// 닉네임이 이미 쓰이고 있는지 서버에 물어봐요 (입력을 멈추면 잠깐 뒤에 한 번)
let nickTimer = null;
function checkNickname(){
  const d = signupDraft;
  if(!d) return;
  const name = d.nickname;
  if(d.nickFor===name) return;   // 이미 확인한 이름
  clearTimeout(nickTimer);
  if(Array.from(name).length < 2 || name==='익명') return;
  nickTimer = setTimeout(async ()=>{
    let free = true;             // 확인에 실패하면 일단 통과시키고, 가입할 때 서버가 한 번 더 걸러요
    try{
      const {data, error} = await sb.rpc('nickname_available', {nick:name});
      if(!error) free = data !== false;
    }catch(e){}
    if(!signupDraft || signupDraft.nickname !== name) return;
    signupDraft.nickFor = name;
    signupDraft.nickFree = free;
    if(state.view==='signup1') toggleSignupStep();
  }, 350);
}

function signup1Valid(){
  const d = signupDraft;
  return EMAIL_RE.test(d.email) && d.password.length>=8 && Array.from(d.nickname).length>=2
    && d.nickFor===d.nickname && d.nickFree===true && !!d.birth;
}
function signup2Valid(){
  const d = signupDraft;
  return !!(d.univ && d.year && d.korean && d.stay && d.area);
}
function signup3Valid(){
  const d = signupDraft;
  if(!d.agree || !d.hasJob) return false;
  if(d.hasJob==='있어요') return d.jobIndustries.length>0 && !!d.jobTotal;
  return true;
}

function toggleSignupStep(){
  if(!signupDraft) return;
  if(state.view==='signup1'){
    saveSignup1();
    checkNickname();
    const d = signupDraft;
    const taken = d.nickname==='익명' || (d.nickFor===d.nickname && d.nickFree===false);
    const err = document.getElementById('suNickErr');
    if(err) err.textContent = taken ? t('이미 쓰고 있는 닉네임이에요') : '';
    const btn = document.getElementById('su1Next');
    if(btn) btn.disabled = !signup1Valid();
  } else if(state.view==='signup2'){
    const btn = document.getElementById('su2Next');
    if(btn) btn.disabled = !signup2Valid();
  } else if(state.view==='signup3'){
    const btn = document.getElementById('su3Done');
    if(btn) btn.disabled = !signup3Valid();
  }
}

function pickSignupChip(el){
  const row = el.parentElement;
  const key = row.dataset.signup;
  row.querySelectorAll('.chip').forEach(c=>c.classList.remove('is-active'));
  el.classList.add('is-active');
  signupDraft[key] = el.dataset.value;
  if(key==='hasJob'){ render(); return; }
  toggleSignupStep();
}

function toggleSignupIndustry(el){
  el.classList.toggle('is-active');
  const list = signupDraft.jobIndustries;
  const i = list.indexOf(el.dataset.value);
  if(i>=0) list.splice(i,1); else list.push(el.dataset.value);
  toggleSignupStep();
}

function goSignup(view){
  if(state.view==='signup1'){
    saveSignup1();
    if(view==='signup2' && !signup1Valid()) return;
  }
  if(state.view==='signup2' && view==='signup3' && !signup2Valid()) return;
  navigate(view);
}

async function completeSignup(){
  if(!signupDraft || !signup3Valid()) return;
  const d = signupDraft;
  const hasJob = d.hasJob==='있어요';
  const errEl = document.getElementById('su3Err');
  if(errEl) errEl.textContent = '';
  await withBusy('su3Done', async ()=>{
    // 프로필은 서버가 이 내용으로 자동으로 만들어요 (supabase-setup.sql의 handle_new_user)
    const {data, error} = await sb.auth.signUp({
      email: d.email,
      password: d.password,
      options: {
        emailRedirectTo: siteUrl(),
        data: {
          nickname:d.nickname, univ:d.univ, year:d.year, stay:d.stay, korean:d.korean,
          birth:d.birth, area:d.area, has_job:hasJob,
          job_industries: hasJob ? d.jobIndustries.slice() : [], job_total: hasJob ? d.jobTotal : ''
        }
      }
    });
    if(error){
      const el = document.getElementById('su3Err');
      if(el) el.textContent = t(authErrorKey(error));
      return;
    }
    signupDraft = null; // 비밀번호를 포함한 입력값을 비워요
    if(data.session){
      await enterSession(data.user, 'signup');
    } else {
      // Supabase에서 "이메일 인증"을 켜 둔 경우: 메일의 링크를 눌러야 로그인할 수 있어요
      authNotice = {key:'인증 메일을 보냈어요. 메일의 링크를 누른 뒤 로그인해 주세요.', ok:true};
      navigate('login');
    }
  });
}

async function toggleReviewLike(id){
  const r = REVIEWS.find(x=>x.id===id);
  if(!r || likeBusy.has(id)) return;
  likeBusy.add(id);
  const was = LIKED_REVIEWS.has(id);
  mutations++;
  setLike(LIKED_REVIEWS, r, !was);   // 먼저 화면에 반영하고, 저장에 실패하면 되돌려요
  render();
  let error = null;
  try{
    const res = was
      ? await sb.from('review_likes').delete().eq('review_id', id).eq('user_id', ME_STUDENT.id)
      : await sb.from('review_likes').insert({review_id:id});
    error = res.error;
  }catch(e){ error = e; }
  mutations++;
  likeBusy.delete(id);
  if(error && error.code!=='23505'){
    const cur = REVIEWS.find(x=>x.id===id);
    if(cur && LIKED_REVIEWS.has(id)!==was) setLike(LIKED_REVIEWS, cur, was);
    render();
    showToast(t(FAIL_MSG));
  }
}

function selectKoreanChip(el){

  toggleReviewSubmit();

function toggleReviewSubmit(){
  const good = document.getElementById('rGood');
  const hard = document.getElementById('rHard');
  const tip = document.getElementById('rTip');
  const months = document.getElementById('rMonths');
  const btn = document.getElementById('rSubmitBtn');
  if(!good || !btn) return;
  const koreanSelected = document.querySelector('#rKorean .chip.is-active');
  const m = Number(months.value);
  const monthsValid = months.value && Number.isInteger(m) && m >= 1 && m <= 60;
  btn.disabled = !(good.value.trim() && hard.value.trim() && tip.value.trim() && koreanSelected && monthsValid);
}

async function submitReview(){
  const industry = document.getElementById('rIndustry').value;
  const shopName = document.getElementById('rShop').value.trim();
  const months = Number(document.getElementById('rMonths').value);
  const days = Array.from(document.querySelectorAll('#rDays .chip.is-active')).map(c=>c.dataset.day);
  const timeOfDay = document.getElementById('rTimeOfDay').value;
  const koreanEl = document.querySelector('#rKorean .chip.is-active');
  const korean = koreanEl ? koreanEl.dataset.korean : '';
  const good = document.getElementById('rGood').value.trim();
  const hard = document.getElementById('rHard').value.trim();
  const note = document.getElementById('rNote').value.trim();
  const tip = document.getElementById('rTip').value.trim();
  if(!good || !hard || !tip || !korean || !Number.isInteger(months) || months < 1 || months > 60) return;
  await withBusy('rSubmitBtn', async ()=>{
    // 작성자·조회수·좋아요 수는 서버가 정해요
    const {data, error} = await sb.from('reviews')
      .insert({industry, shop_name:shopName, months, days, time_of_day:timeOfDay, korean, good, hard, note, tip})
      .select('id').single();
    if(error) throw error;
    await loadAll();
    navigate('reviewDetail', data.id, {replace:true});
    showToast(t('후기가 등록됐어요'));
  });
}

  const matches = QUESTIONS.filter(item => item.cat===catSel && (item.title.toLowerCase().includes(q) || tc(item.title).toLowerCase().includes(q))).slice(0,2);

  return allAnswers.length > 1 && a.likes > 0 && a.likes === Math.max(...allAnswers.map(x=>x.likes));

function answerHTML(qid, a, idx, allAnswers, item, isAsker){
  const isResolver = item.resolved && item.resolvedIdx===idx;

  if(isResolver) stamp = `<div class="stamp">${icon('check')} ${t('답변완료')}</div>`;
  else if(hot) stamp = `<div class="stamp">${icon('heart')} ${t('인기 답변')}</div>`;
  return `
    <div class="answer-card ${isResolver||hot ? 'is-hot' : ''}">

          </div>

      <div class="answer-actions">
        <button type="button" class="like-btn ${liked?'is-liked':''}" aria-pressed="${liked}" aria-label="${t('좋아요')} ${a.likes}" onclick="toggleLike('${qid}','${a.id}')">${icon('heart')} ${a.likes}</button>
        ${isAsker && !item.resolved ? `<button class="resolve-btn" onclick="resolveQuestion('${qid}','${a.id}')">${t('이 답변으로 완료하기')}</button>` : ''}

      </div>
    </div>
  `;

async function toggleLike(qid, answerId){
  const find = ()=>{ const q = qOf(qid); return q && q.answers.find(x=>x.id===answerId); };
  const a = find();
  if(!a || likeBusy.has(answerId)) return;
  likeBusy.add(answerId);
  const was = LIKED_ANSWERS.has(answerId);
  mutations++;
  setLike(LIKED_ANSWERS, a, !was);   // 먼저 화면에 반영하고, 저장에 실패하면 되돌려요
  render();
  let error = null;
  try{
    const res = was
      ? await sb.from('answer_likes').delete().eq('answer_id', answerId).eq('user_id', ME_STUDENT.id)
      : await sb.from('answer_likes').insert({answer_id:answerId});
    error = res.error;
  }catch(e){ error = e; }
  mutations++;
  likeBusy.delete(answerId);
  if(error && error.code!=='23505'){
    const cur = find();
    if(cur && LIKED_ANSWERS.has(answerId)!==was) setLike(LIKED_ANSWERS, cur, was);
    render();
    showToast(t(FAIL_MSG));
  }
}

// 알림: 내 질문에 달린 답변, 답변완료로 뽑힌 내 답변
function buildNotifs(){
  const me = ME_STUDENT.id;
  const list = [];
  QUESTIONS.forEach(q=>{
    if(q.author.id===me){
      q.answers.forEach(a=>{
        if(a.author.id!==me) list.push({type:'answer', name:a.author.name, title:q.title, qid:q.id, at:a.createdAt});
      });
    } else if(q.resolved){
      const a = q.answers[q.resolvedIdx];
      if(a && a.author.id===me) list.push({type:'resolved', title:q.title, qid:q.id, at:q.resolvedAt || a.createdAt});
    }
  });
  return list.sort((x,y)=>new Date(y.at) - new Date(x.at)).slice(0, 50);
}

  const list = buildNotifs();
  return `
    <div class="topbar">

      ${list.length ? list.map(n=>`

    });
  });
  if(!mine.length) return `<div class="empty-state">아직 남긴 답변이 없어요.</div>`;
  return mine.map(m=>`
    <button class="mylist-item" onclick="navigate('detail','${m.q.id}')">
      <div class="mylist-q">${esc(m.q.title)}</div>
      <div class="mylist-a">${esc(m.a.body)}</div>
    </button>
  `).join('');
}

/* ===== 시작 =====
   이미 로그인돼 있으면 바로 홈으로, 아니면 로그인 화면으로 가요. */
state.recovering = /[#&]type=recovery/.test(OPENED_HASH);                 // 비밀번호 재설정 메일의 링크로 들어온 경우
const openedWithLinkError = /[#&]error(_code)?=/.test(OPENED_HASH);       // 만료된 메일 링크로 들어온 경우

async function boot(){
  state.lang = detectLang();
  applyLang();
  if(!SERVER_READY){ state.view = 'setup'; render(); return; }
  if(!sb){ lastLoadError = 'supabase-js를 불러오지 못했어요'; state.view = 'loadError'; render(); return; }
  state.view = 'loading';
  render();

  // 이 안에서는 서버에 다시 요청하지 않고, 화면 상태만 바꿔요
  sb.auth.onAuthStateChange(event=>{
    if(event==='PASSWORD_RECOVERY'){
      state.recovering = true;
      if(ME_STUDENT.id && state.view!=='loading') navigate('newPassword', null, {replace:true});
    }
    if(event==='SIGNED_OUT' && ME_STUDENT.id){   // 다른 탭에서 로그아웃했거나 로그인 기간이 끝난 경우
      clearLocal();
      navigate('login');
    }
  });

  let session = null;
  try{ session = (await sb.auth.getSession()).data.session; }catch(e){}
  if(session){
    await enterSession(session.user);
  } else {
    state.recovering = false;
    navigate('login', null, {replace:true});
    if(openedWithLinkError) setAuthNotice('링크가 만료됐거나 이미 사용됐어요. 다시 시도해 주세요.', false);
  }
}
boot();
</script>
</body>
</html>
